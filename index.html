<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員食堂ランチキャンセル / Cafeteria Lunch Cancellation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Yomogi&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap');

:root{
  --bg:#FBF3D9;
  --surface:#FFFFFF;
  --ink:#3A2B22;
  --ink-soft:#7A6754;
  --line:#EDE0B0;
  --accent:#F0B429;
  --accent-soft:#FCEFC0;
  --accent-deep:#9C6B12;
  --accent-deeper:#7A5109;
  --good:#B8860B;
  --good-soft:#F6ECC9;
  --stamp:#B23A2E;
  --danger:#B23A2E;
  --danger-soft:#F4DEDA;
  --radius:14px;
  --shadow: 0 2px 10px rgba(58,43,34,0.08), 0 1px 2px rgba(58,43,34,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(143,185,62,0.09), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Noto Sans JP','Inter',sans-serif;
  min-height:100vh;
  padding:0 0 60px 0;
}
#app{max-width:920px;margin:0 auto;padding:20px 16px 40px;}

.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding:22px 24px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.masthead::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
}
.masthead-brand{display:flex;align-items:center;gap:16px;}
.brand-logo{height:52px;width:auto;display:block;flex-shrink:0;border-radius:10px;}
@media (max-width:560px){.brand-logo{height:40px;}}
.masthead h1{
  font-family:'Yomogi',cursive;
  font-weight:700;
  font-size:23px;
  margin:0;
  letter-spacing:0.02em;
  color:var(--accent-deep);
  line-height:1.3;
}
.masthead p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.eyebrow{
  font-size:15px;letter-spacing:0.06em;color:var(--accent-deep);
  font-weight:800;margin-bottom:8px;
}
.masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.admin-corner-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  font-family:inherit;font-size:11.5px;font-weight:600;
  padding:6px 12px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:all .15s ease;
}
.admin-corner-btn:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);}
@media (max-width:560px){.admin-corner-btn{font-size:10.5px;padding:5px 9px;}}

.tabbar{
  display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;
}
.tabbtn{
  flex:1;min-width:140px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  border-radius:10px;
  padding:11px 14px;
  font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  text-align:center;
}
.tabbtn.active{
  background:var(--ink);color:#fff;border-color:var(--ink);
}
.tabbtn:hover:not(.active){border-color:var(--accent);color:var(--ink);}

.backlink{
  border:none;background:none;color:var(--ink-soft);font-family:inherit;
  font-size:12.5px;cursor:pointer;padding:0 2px;margin-bottom:14px;
}
.backlink:hover{color:var(--ink);text-decoration:underline;}

.staff-footer{
  text-align:center;margin-top:34px;padding-top:14px;
}
.stafflink{
  border:none;background:none;color:#A9A499;font-family:inherit;
  font-size:11.5px;cursor:pointer;padding:4px 8px;letter-spacing:0.01em;
}
.stafflink:hover{color:var(--ink-soft);text-decoration:underline;}

.mine-card{background:#FCFBF7;}
.mine-toggle{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  user-select:none;
}
.mine-toggle .chev{color:var(--ink-soft);font-size:14px;}
.mine-toggle h2{font-size:16px;color:var(--ink-soft);}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.card h2{
  font-family:'Shippori Mincho',serif;
  font-size:18px;margin:0 0 14px 0;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.card h2 .num{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-deep);
  font-size:12px;font-weight:800;font-family:'Noto Sans JP',sans-serif;
}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.02em;}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=number],textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:16px;background:#FCFBF8;color:var(--ink);
}
input[type=text]:focus,input[type=password]:focus,input[type=date]:focus{
  outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);
}
.field{margin-bottom:14px;}
.field-row{display:flex;gap:10px;align-items:stretch;}
.field-row input{flex:1;min-width:0;}
@media (max-width:480px){.field-row{flex-wrap:wrap;}.field-row input{width:100%;}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.row2{grid-template-columns:1fr;}}
.radiochip{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:14px;cursor:pointer;
  background:#FCFBF8;transition:all .15s ease;
}
.radiochip input{margin:0;accent-color:var(--accent-deep);}
.radiochip.checked{border-color:var(--accent-deep);background:var(--accent-soft);font-weight:600;}

.notice{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--accent-soft);
  border:1px solid var(--accent);
  border-radius:10px;padding:12px 14px;margin-bottom:14px;
  font-size:13.5px;line-height:1.55;color:var(--accent-deep);
}
.notice b{display:block;color:var(--accent-deep);}
.notice.danger{background:var(--danger-soft);border-color:var(--danger);color:#7A2A20;}
.notice.good{background:var(--good-soft);border-color:var(--good);color:var(--accent-deep);}

.langtoggle{display:flex;gap:4px;background:#F1EEE3;border-radius:999px;padding:3px;}
.langtoggle button{
  border:none;background:transparent;padding:6px 14px;border-radius:999px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.langtoggle button.active{background:var(--ink);color:#fff;}

.calnav{display:flex;align-items:center;justify-content:space-between;margin:0 auto 10px;max-width:320px;}
.calnav .navbtn{
  border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
  cursor:pointer;font-size:15px;color:var(--ink);
}
.calnav .navbtn:disabled{opacity:0.3;cursor:not-allowed;}
.calnav .label{font-weight:700;font-size:15px;font-family:'Shippori Mincho',serif;}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px;margin:0 auto;}
.calgrid .wd{
  text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);padding:3px 0;
}
.calcell{
  position:relative;aspect-ratio:1/1;border-radius:7px;border:1px solid var(--line);
  background:#FCFBF8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:11.5px;color:var(--ink);gap:2px;transition:all .12s ease;min-height:32px;max-width:40px;
}
.calcell.outmonth{opacity:0.28;pointer-events:none;}
.calcell.disabled{opacity:0.35;cursor:not-allowed;background:repeating-linear-gradient(135deg,#f2f0ea,#f2f0ea 4px,#eae6da 4px,#eae6da 8px);}
.calcell.today{border-color:var(--accent);border-width:2px;}
.calcell.selected{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep);}
.calcell:hover:not(.disabled):not(.outmonth){border-color:var(--accent);}
.calcell .dot{width:5px;height:5px;border-radius:50%;background:var(--stamp);position:absolute;bottom:4px;}
.calcell .cnt{font-size:10px;font-weight:800;}

.pin-link{
  border:none;background:none;color:var(--ink-soft);font-size:12.5px;
  cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px;
  font-family:inherit;
}
.pin-link:hover{color:var(--ink);}
.pin-input-small{max-width:160px;font-size:14px;padding:9px 12px;}

.chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{
  background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;
  padding:5px 10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.chip button{border:none;background:none;color:var(--accent-deep);cursor:pointer;font-weight:900;padding:0;font-size:13px;}

.weekday-pick{display:flex;gap:6px;flex-wrap:wrap;}
.wdbtn{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;width:40px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.wdbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.btn{
  border:none;border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:transform .08s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#241A14;}
.btn-accent{background:var(--accent-deep);color:#fff;}
.btn-accent:hover{background:var(--accent-deeper);}
.btn-submit{
  background:var(--accent-deep);color:#fff;
  width:100%;padding:16px 20px;font-size:16.5px;font-weight:800;
  border-radius:12px;letter-spacing:0.02em;
  box-shadow:0 6px 16px -4px rgba(0,0,0,0.35);
}
.btn-submit:hover{background:var(--accent-deeper);box-shadow:0 8px 20px -4px rgba(0,0,0,0.4);}
.btn-submit:disabled{opacity:0.6;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.checkline{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;font-size:14px;font-weight:600;}
.checkline input{width:17px;height:17px;accent-color:var(--accent-deep);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;}
tr:hover td{background:#FAF8F2;}

.stamp-overlay{
  position:fixed;inset:0;background:rgba(31,50,59,0.45);
  display:flex;align-items:center;justify-content:center;z-index:50;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stamp-card{
  background:var(--surface);border-radius:16px;padding:36px 40px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);max-width:360px;position:relative;
}
.hanko{
  width:92px;height:92px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;line-height:1.1;
  transform:rotate(-8deg);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1);
  writing-mode:vertical-rl;letter-spacing:2px;
}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.4);opacity:0;}to{transform:rotate(-8deg) scale(1);opacity:1;}}
.stamp-card h3{margin:0 0 6px;font-family:'Shippori Mincho',serif;font-size:19px;}
.stamp-card p{margin:0 0 18px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}

.searchrow{display:flex;gap:8px;}
.searchrow input{flex:1;}

.daylist{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.daylist .item{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px solid #F0EEE4;}
.small{font-size:12px;color:var(--ink-soft);}
.footnote{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
.badge.single{background:var(--good-soft);color:var(--accent-deep);}
.badge.recurring{background:var(--accent-soft);color:var(--accent-deep);}
textarea.csvbox{
  width:100%;min-height:140px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:8px;padding:10px;background:#FCFBF8;
}
.toastmini{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow);z-index:60;
}
.board{
  background:var(--ink);
  border-radius:var(--radius);
  padding:22px 22px 18px;
  margin-bottom:16px;
  color:#fff;
  box-shadow:var(--shadow);
}
.board-date{font-size:12.5px;letter-spacing:0.04em;color:#D9C08A;margin-bottom:16px;font-weight:600;}
.board-main{text-align:center;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.14);}
.board-main-num{
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:58px;color:var(--accent);line-height:1;
}
.board-main-lbl{font-size:14px;margin-top:8px;color:#F5E9C8;font-weight:600;}
.board-main-sub{font-size:13px;margin-top:8px;color:#E3D2A0;}
.board-sub{text-align:center;}
.board-sub-num{
  font-family:'Shippori Mincho',serif;font-weight:700;font-size:26px;color:#E29A8C;line-height:1;
}
.board-sub-lbl{font-size:12px;margin-top:4px;color:#CBB98D;}
.board-sub-sub{font-size:11.5px;margin-top:4px;color:#B8A57C;}
.status-msg{font-size:12.5px;color:var(--ink-soft);min-height:16px;margin-top:6px;}

/* ---- Mobile tuning (phones) ---- */
@media (max-width:480px){
  #app{padding:12px 10px 32px;}
  .masthead{padding:16px 16px 16px 20px;}
  .masthead-brand{gap:10px;}
  .brand-logo{height:34px;}
  .masthead h1{font-size:16.5px;}
  .admin-corner-btn{padding:5px 10px;font-size:10.5px;}
  .card{padding:16px;}
  .card h2{font-size:16px;margin-bottom:12px;}
  .btn{padding:12px 16px;font-size:14px;}
  .btn-submit{padding:15px 18px;font-size:16px;}
  .wdbtn{width:36px;padding:10px 0;font-size:12px;}
  .calcell{min-height:38px;}
  .board-main-num{font-size:46px;}
  .board-sub-num{font-size:22px;}
  .notice{font-size:13px;padding:11px 12px;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
</head>

let backendWarningShown = false;
function warnBackendNotConfigured(){
  if(backendWarningShown) return;
  backendWarningShown = true;
  console.error('BACKEND_URL が設定されていません。ファイル内の BACKEND_URL 定数にApps ScriptのURLを貼り付けてください。');

async function kvRequest(action, extra){
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR_') === 0){
    warnBackendNotConfigured();
    return null;
  }
  try{
    const params = new URLSearchParams();
    params.set('action', action);
    if(extra){
      if(extra.key !== undefined) params.set('key', extra.key);
      if(extra.value !== undefined) params.set('value', extra.value);
      if(extra.prefix !== undefined) params.set('prefix', extra.prefix);
      if(extra.payload !== undefined) params.set('payload', JSON.stringify(extra.payload));
    }
    const res = await fetch(BACKEND_URL + '?' + params.toString(), { method:'GET' });
    return await res.json();
  }catch(e){
    console.error('kvRequest failed:', action, e);
    return null;
  }
}

// items(配列)を小分けにして kvSetMany へ送る（1リクエストのURLが長くなりすぎないように）
async function kvSetManyChunked(items, chunkSize){
  chunkSize = chunkSize || 15;
  for(let i=0; i<items.length; i+=chunkSize){
    const chunk = items.slice(i, i+chunkSize);
    await kvRequest('kvSetMany', {payload: chunk});
  }
}

  const newIds = new Set(list.map(e=>String(e.id)));
  // 削除された人を消す
  for(const id of existingIds){
    if(!newIds.has(id)) await kvRequest('kvDelete', {key:'master:'+id});
  }
  // 追加・更新をまとめて送信
  const items = list.map(e=>({key:'master:'+e.id, value: JSON.stringify(e)}));
  await kvSetManyChunked(items);
  return true;
}

function isPastCutoff(dateISOStr){
  const t = todayISO();
  if(dateISOStr < t) return true;
  if(dateISOStr === t){
    const now = new Date();
    return now.getHours() >= 8;
  }
  return false;
}
function monthLabel(y,m,lang){
  const monthsEn = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return lang==='ja' ? `${y}年${m+1}月` : `${monthsEn[m]} ${y}`;
}
function buildMonthGrid(y,m){
  const first = new Date(y,m,1);
  const startWd = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startWd;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(iso(y,m,d));
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function occurrencesInMonth(rule, y, m){
  const daysInMonth = new Date(y,m+1,0).getDate();
  const out = [];
  const start = rule.start ? parseISO(rule.start) : null;
  const end = rule.end ? parseISO(rule.end) : null;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d);
    const wd = dt.getDay();
    if(!rule.weekdays.includes(wd)) continue;
    if(start && dt < new Date(start.getFullYear(),start.getMonth(),start.getDate())) continue;
    if(end && dt > new Date(end.getFullYear(),end.getMonth(),end.getDate())) continue;
    out.push(iso(y,m,d));
  }
  return out;
}

  });

  if(backBtn) backBtn.onclick = ()=>{ state.view='main'; render(); };
  const adminEntryBtn = document.getElementById('admin-entry-link');
  if(adminEntryBtn) adminEntryBtn.onclick = ()=>{ state.view = state.adminUnlocked ? 'admin' : 'adminLogin'; render(); };

  const vp = document.getElementById('viewport');
  if(state.view==='main') vp.innerHTML = '', renderMain(vp);
  else if(state.view==='adminLogin') vp.innerHTML='', renderAdminLogin(vp);
  else if(state.view==='admin') vp.innerHTML='', renderAdmin(vp);
}

/* ---------- MAIN VIEW (form + my records together) ---------- */
function renderMain(vp){
  vp.innerHTML = `<div id="form-section"></div><div id="mine-section"></div>`;
  renderForm(document.getElementById('form-section'));
  renderMineSection(document.getElementById('mine-section'));
}

function renderForm(vp){
  const t = T[state.lang];
  const {y,m} = state.formMonth;
  const cells = buildMonthGrid(y,m);
  const wdLabels = [t.su,t.mo,t.tu,t.we,t.th,t.fr,t.sa];

  const isPrevDisabled = (y===today.getFullYear() && m===today.getMonth());
  const chips = Array.from(state.selectedDates).sort().map(d=>`
      <span class="chip">${d}<button data-del="${d}">×</button></span>
  `).join('') || `<span class="small">${t.noneSelected}</span>`;

  vp.innerHTML = `
    <div class="card">
      <h2><span class="num">1</span>${t.step1}</h2>
      <div class="row2">
        <div class="field">
          <label>${t.empId}</label>
          <input type="text" id="f-empid" placeholder="${t.empIdPh}" value="${escapeHtml(state.empId)}">
          <p class="footnote" style="margin-top:6px;">${t.empIdNotice}</p>
        </div>
        <div class="field">
          <label>${t.empName}</label>
          <input type="text" id="f-empname" placeholder="${t.empNamePh}" value="${escapeHtml(state.empName)}">
        </div>
      </div>
      <div id="pin-toggle-wrap" style="${state.pinPanelOpen?'display:none':''}">
        <button type="button" class="pin-link" id="pin-open-link">${t.pinOpenLink}</button>
      </div>
      <div id="pin-panel" style="${state.pinPanelOpen?'':'display:none'}">
        <div class="field" style="margin-top:2px;">
          <label class="small">${t.pin} <span style="font-weight:400;color:var(--ink-soft)">${t.optional}</span></label>
          <input type="password" inputmode="numeric" maxlength="4" id="f-emppin" class="pin-input-small" placeholder="${t.pinPh}" value="${escapeHtml(state.empPin)}">
        </div>
        <p class="footnote">${t.pinNotice}</p>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">2</span>${t.step2}</h2>
      <div class="notice">
        <div>🕗</div>
        <div><b>${t.cutoffTitle}</b>${t.cutoffBody}</div>
      </div>
      <div class="calnav">
        <button class="navbtn" id="cal-prev" ${isPrevDisabled?'disabled':''}>‹</button>
        <div class="label">${monthLabel(y,m,state.lang)}</div>
        <button class="navbtn" id="cal-next">›</button>
      </div>
      <div class="calgrid">
        ${wdLabels.map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells.map(dstr=>{
          if(!dstr) return `<div class="calcell outmonth"></div>`;
          const disabled = isPastCutoff(dstr);
          const selected = state.selectedDates.has(dstr);
          const isToday = dstr === todayISO();
          const dayNum = Number(dstr.split('-')[2]);
          return `<div class="calcell ${disabled?'disabled':''} ${selected?'selected':''} ${isToday?'today':''}" data-date="${dstr}" title="${disabled?t.pastCutoffCell:''}">
              <div>${dayNum}</div>
            </div>`;
        }).join('')}
      </div>
      <div style="margin-top:12px;">
        <label>${t.selected}</label>
        <div class="chipwrap">${chips}</div>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">3</span>${t.step3}</h2>
      <div class="checkline" id="recurring-toggle-line">
        <input type="checkbox" id="recurring-toggle" ${state.recurringOn?'checked':''}>
        <span>${t.recurringToggle}</span>
      </div>
      <div id="recurring-panel" style="${state.recurringOn?'':'display:none'}">
        <label>${t.recurringWd}</label>
        <div class="weekday-pick" style="margin-bottom:14px;">
          ${wdLabels.map((w,idx)=>`<button type="button" class="wdbtn ${state.recurringWd.has(idx)?'active':''}" data-wd="${idx}">${w}</button>`).join('')}
        </div>
        <div class="row2">
          <div class="field">
            <label>${t.recurringStart}</label>
            <input type="date" id="rec-start" value="${state.recurringStart}">
          </div>
          <div class="field">
            <label>${t.recurringEnd}</label>
            <input type="date" id="rec-end" value="${state.recurringEnd}">
          </div>
        </div>
      </div>
    </div>

    ${state.msg ? `<div class="notice danger">${state.msg}</div>` : ''}

    <div class="btnrow">
      <button class="btn btn-submit" id="submit-btn" ${state.submitting?'disabled':''}>${state.submitting? t.submitting : '✓ '+t.submit}</button>
    </div>
  `;

  vp.querySelector('#f-empid').oninput = e=>{ state.empId = e.target.value; persistEmpProfile(); };
  vp.querySelector('#f-empname').oninput = e=>{ state.empName = e.target.value; persistEmpProfile(); };
  const pinOpenLink = vp.querySelector('#pin-open-link');
  if(pinOpenLink) pinOpenLink.onclick = ()=>{ state.pinPanelOpen = true; renderForm(vp); };
  const pinInput = vp.querySelector('#f-emppin');
  if(pinInput) pinInput.oninput = e=>{ state.empPin = e.target.value.replace(/[^0-9]/g,'').slice(0,4); };
  
  vp.querySelector('#cal-prev').onclick = ()=>{
    let {y,m} = state.formMonth; m--; if(m<0){m=11;y--;}
    state.formMonth = {y,m}; render();
  };
  vp.querySelector('#cal-next').onclick = ()=>{
    let {y,m} = state.formMonth; m++; if(m>11){m=0;y++;}
    state.formMonth = {y,m}; render();
  };
  vp.querySelectorAll('.calcell[data-date]').forEach(c=>{
    c.onclick = ()=>{
      const d = c.dataset.date;
      if(isPastCutoff(d)) return;
      if(state.selectedDates.has(d)) state.selectedDates.delete(d);
      else state.selectedDates.add(d);
      render();
    };
  });
  vp.querySelectorAll('.chip button[data-del]').forEach(b=>{
    b.onclick = ()=>{ state.selectedDates.delete(b.dataset.del); render(); };
  });
  vp.querySelector('#recurring-toggle').onchange = e=>{ state.recurringOn = e.target.checked; render(); };
  vp.querySelectorAll('.wdbtn').forEach(b=>{
    b.onclick = ()=>{
      const idx = Number(b.dataset.wd);
      if(state.recurringWd.has(idx)) state.recurringWd.delete(idx);
      else state.recurringWd.add(idx);
      render();
    };
  });
  const rs = vp.querySelector('#rec-start'); if(rs) rs.onchange = e=>{ state.recurringStart = e.target.value; };
  const re = vp.querySelector('#rec-end'); if(re) re.onchange = e=>{ state.recurringEnd = e.target.value; };

  vp.querySelector('#submit-btn').onclick = submitCancellation;
}

async function submitCancellation(){
  const t = T[state.lang];
  state.msg = null;
  if(!state.empId.trim() || !state.empName.trim()){
    state.msg = t.needIdName; render(); return;
  }
  if(state.empPin.trim() && !/^\d{4}$/.test(state.empPin.trim())){
    state.msg = t.needPin; render(); return;
  }
  const hasSingle = state.selectedDates.size > 0;
  const hasRecurring = state.recurringOn && state.recurringWd.size > 0;
  if(!hasSingle && !hasRecurring){
    state.msg = t.needDates; render(); return;
  }

  const id = state.empId.trim();
  const pin = state.empPin.trim();

  const masterCheck = await checkAgainstMaster(id, state.empName.trim());
  if(masterCheck && !masterCheck.ok){
    state.msg = masterCheck.reason==='not_found' ? t.masterNotFound : t.masterMismatch;
    render(); return;
  }

  const preCheck = await getEmp(id);
  if(preCheck && preCheck.pin && preCheck.pin !== pin){
    state.msg = t.wrongPin; render(); return;
  }

  state.submitting = true; render();

  const existing = preCheck || {employeeId:id, name:state.empName.trim(), singleDates:[], recurring:[]};
  existing.name = state.empName.trim();
  existing.pin = existing.pin || pin;
  const singleSet = new Set(existing.singleDates || []);
  state.selectedDates.forEach(d=>singleSet.add(d));
  existing.singleDates = Array.from(singleSet).sort();

  if(hasRecurring){
    existing.recurring = existing.recurring || [];
    existing.recurring.push({
      id: 'r'+Date.now(),
      weekdays: Array.from(state.recurringWd).sort(),
      start: state.recurringStart || todayISO(),
      end: state.recurringEnd || null,
    });
  }
  existing.updatedAt = new Date().toISOString();

  await setEmp(id, existing);

  // fire-and-forget push to Google Sheets if configured
  pushToSheet({
    employeeId: id, name: existing.name,
    singleDates: Array.from(state.selectedDates),
    recurring: hasRecurring ? [{
      weekdays: Array.from(state.recurringWd),
      start: state.recurringStart || todayISO(),
      end: state.recurringEnd || null,
    }] : [],
    timestamp: new Date().toISOString(),
  });

  state.submitting = false;
  state.selectedDates = new Set();
  state.recurringOn = false; state.recurringWd = new Set(); state.recurringEnd='';
  render();
  showStamp(t.successTitle, t.successBody, state.lang==='ja' ? '受付済' : 'RECEIVED');
}

async function pushToSheet(payload){
  await kvRequest('logCancellation', {payload: payload});
}

function showStamp(title, body){
  const overlay = document.createElement('div');
  overlay.className = 'stamp-overlay';
  overlay.innerHTML = `
    <div class="stamp-card">
      <div class="hanko">${state.lang==='ja'?'受付済':'OK'}</div>
      <h3>${title}</h3>
      <p>${body}</p>
      <button class="btn btn-primary" id="stamp-close">${T[state.lang].close}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#stamp-close').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}

    if(!id || (pin && !/^\d{4}$/.test(pin))){
      state.mineRecord = null; state.mineWrongPin = false; state.mineSearched = true;
      renderMineResult(true);

      renderMineResult();

    const box = document.getElementById('mine-result');
    if(needPinMsg){
      box.innerHTML = `<div class="card"><p class="notice danger">${t.mineNeedIdOrPin}</p></div>`;
      return;
    }

      box.innerHTML = `<div class="card"><p class="notice danger">${t.wrongPin}</p></div>`;

    if(!state.mineRecord){
      box.innerHTML = `<div class="card"><p class="notice danger">${t.mineNotFound}</p></div>`;
      return;

    const rec = state.mineRecord;
    const singleRows = (rec.singleDates||[]).sort().map(d=>`

      const wdNames = r.weekdays.map(i=>T[state.lang][WD_KEYS[i]]).join(state.lang==='ja'?'・':', ');
      return `<div class="daylist item"><span>${t.weekdayLabel} ${wdNames} <span class="small">(${r.start} 〜 ${r.end||(state.lang==='ja'?'継続':'ongoing')})</span></span>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" data-del-rec="${r.id}">${t.delete}</button>
      </div>`;
    }).join('') || `<p class="small">${t.none}</p>`;

    box.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(rec.name)} <span class="small">(${rec.employeeId})</span></h2>
        <label>${t.singleDates}</label>
        ${singleRows}
        <div style="height:14px"></div>
        <label>${t.recurringRules}</label>
        ${recRows}
        <div style="height:18px"></div>
        <label>${t.changePin}</label>
        <div class="row2" style="align-items:end;">
          <div class="field" style="margin-bottom:0;">
            <input type="password" inputmode="numeric" maxlength="4" id="mine-newpin" placeholder="${t.pinPh}">
          </div>
          <div class="field" style="margin-bottom:0;">
            <button class="btn btn-ghost" id="mine-pin-save" style="width:100%">${t.changePin}</button>
          </div>
        </div>
        <div class="status-msg" id="mine-pin-status"></div>
      </div>
    `;
    box.querySelector('#mine-pin-save').onclick = async ()=>{
      const npInput = box.querySelector('#mine-newpin');
      const np = npInput.value.replace(/[^0-9]/g,'').slice(0,4);
      const statusEl = box.querySelector('#mine-pin-status');
      if(!/^\d{4}$/.test(np)){
        statusEl.textContent = t.needPin; statusEl.style.color = 'var(--danger)';
        return;
      }
      rec.pin = np;
      await setEmp(rec.employeeId, rec);
      state.minePin = np;
      statusEl.textContent = t.pinChanged; statusEl.style.color = 'var(--good)';
      npInput.value = '';
    };
    box.querySelectorAll('[data-del-single]').forEach(b=>{
      b.onclick = async ()=>{
        rec.singleDates = (rec.singleDates||[]).filter(d=>d!==b.dataset.delSingle);
        await setEmp(rec.employeeId, rec);
        renderMineResult();
      };
    });
    box.querySelectorAll('[data-del-rec]').forEach(b=>{
      b.onclick = async ()=>{
        rec.recurring = (rec.recurring||[]).filter(r=>r.id!==b.dataset.delRec);
        await setEmp(rec.employeeId, rec);
        renderMineResult();
      };
    });
  }
}

async function renderAdmin(vp){
  const t = T.ja;
  vp.innerHTML = `<div class="card"><p class="small">読み込み中…</p></div>`;
  const records = await listAllEmpRecords();
  state.adminAllRecords = records;
  if(!state.employeeMasterText){
    const masterForText = await getEmployeeMaster();
    state.employeeMasterText = masterForText.map(e=>`${e.id},${e.name},${e.mealType==='set'?'セット':e.mealType==='okazu'?'おかず':''}`).join('\n');
  }
  drawAdmin();

  function occurrencesForDate(dateStr){
    const dt = parseISO(dateStr);
    const wd = dt.getDay();
    const out = [];
    records.forEach(rec=>{
      if((rec.singleDates||[]).includes(dateStr)){
        out.push({employeeId:rec.employeeId,name:rec.name,type:'single'});
      }
      (rec.recurring||[]).forEach(rule=>{
        if(!rule.weekdays.includes(wd)) return;
        if(rule.start && dateStr < rule.start) return;
        if(rule.end && dateStr > rule.end) return;
        out.push({employeeId:rec.employeeId,name:rec.name,type:'recurring'});
      });
    });
    return out;
  }

  function drawAdmin(){
    Promise.all([getEmployeeMaster(), getSpecialPriceDays()]).then(([master, specialDays])=>{
    specialDays.sort();
    const tISO = todayISO();
    const todayCancelList = occurrencesForDate(tISO);
    const cancelledIdsToday = new Set(todayCancelList.map(x=>x.employeeId));

    const masterAvailable = master.length > 0;
    let eatingTotal=0, eatingSet=0, eatingOkazu=0, eatingUnknown=0;
    let cancelTotal=0, cancelSet=0, cancelOkazu=0, cancelUnknown=0;

    if(masterAvailable){
      master.forEach(e=>{
        if(cancelledIdsToday.has(e.id)){
          cancelTotal++;
          if(e.mealType==='set') cancelSet++; else if(e.mealType==='okazu') cancelOkazu++; else cancelUnknown++;
        }else{
          eatingTotal++;
          if(e.mealType==='set') eatingSet++; else if(e.mealType==='okazu') eatingOkazu++; else eatingUnknown++;
        }
      });
    } else {
      cancelTotal = todayCancelList.length;
    }

    const searchDate = state.adminDateSearch || tISO;
    const dateList = occurrencesForDate(searchDate);

    const nameSearchLower = (state.adminSearch||'').trim().toLowerCase();
    const nameResults = nameSearchLower ? records.filter(r=>
      (r.employeeId+'').toLowerCase().includes(nameSearchLower) || (r.name||'').toLowerCase().includes(nameSearchLower)
    ).sort((a,b)=> (a.employeeId+'').localeCompare(b.employeeId+'')) : [];

    vp.innerHTML = `
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;">
        <button class="btn btn-ghost" id="admin-logout">${t.logout}</button>
      </div>

      <div class="board">

        </div>
        <div class="board-sub">
          <div class="board-sub-num">${cancelTotal}</div>
          <div class="board-sub-lbl">${t.cancelToday}</div>
          <div class="board-sub-sub">${t.setLabel} ${cancelSet}${t.peopleUnit} ・ ${t.okazuLabel} ${cancelOkazu}${t.peopleUnit}${cancelUnknown? ' ・ '+t.unknownLabel+' '+cancelUnknown+t.peopleUnit : ''}</div>

      const d = dateInput.value;
      if(!d) return;
      const current = await getSpecialPriceDays();
      if(current.includes(d)){
        state.specialDaysMsg = {text:t.specialDaysAlready, ok:false}; drawAdmin(); return;

      current.push(d);

      btn.onclick = async ()=>{

        const next = current.filter(x=>x!==d);
        await setSetting('specialPriceDays', JSON.stringify(next));

      if(result && result.missingMealType > 0){
        state.csvWarning = t.csvMealTypeWarning.replace('{n}', result.missingMealType);
        drawAdmin();
        setTimeout(()=>{ state.csvWarning=''; drawAdmin(); }, 8000);
      }
    };

    vp.querySelector('#adm-test-url').onclick = async ()=>{
      const r = await kvRequest('kvSet', {key:'settings:__connectionTest', value:new Date().toISOString()});
      state.urlSavedMsg = (r && r.ok) ? '✅ 接続に成功しました' : '❌ 接続できませんでした。BACKEND_URLの設定を確認してください。';
      drawAdmin();
      setTimeout(()=>{ state.urlSavedMsg=''; drawAdmin(); },4000);
    };

    vp.querySelector('#adm-pw-save').onclick = async ()=>{
      const pwInput = document.getElementById('adm-new-pw');
      const newPw = pwInput.value;
      if(newPw.trim().length < 4){
        state.pwMsg = {text:t.passwordTooShort, ok:false}; drawAdmin(); return;
      }
      await setSetting('adminPassword', newPw.trim());
      state.pwMsg = {text:t.passwordChanged, ok:true};
      drawAdmin();
      setTimeout(()=>{ state.pwMsg=null; drawAdmin(); },4000);
    };

    vp.querySelector('#adm-master-text').oninput = e=>{ state.employeeMasterText = e.target.value; };
    vp.querySelector('#adm-master-save').onclick = async ()=>{
      const lines = state.employeeMasterText.split('\n').map(l=>l.trim()).filter(Boolean);
      const parsed = [];
      for(const line of lines){
        const parts = line.split(',').map(p=>p.trim());
        if(parts.length<2 || !parts[0] || !parts[1]){
          state.employeeMasterMsg = {text:t.employeeMasterInvalid, ok:false}; drawAdmin(); return;
        }
        const [id, name, typeRaw] = parts;
        let mealType;
        if(typeRaw){
          if(/セット|^set$/i.test(typeRaw)) mealType = 'set';
          else if(/おかず|^okazu$/i.test(typeRaw)) mealType = 'okazu';
        }
        parsed.push({id, name, mealType});
      }
      await setEmployeeMaster(parsed);
      state.employeeMasterMsg = {text:t.employeeMasterSaved.replace('{n}', parsed.length), ok:true};
      drawAdmin();
      setTimeout(()=>{ state.employeeMasterMsg=null; drawAdmin(); },3000);
    };
    }); // end Promise.all(...).then
  }
}

/* ---- Monthly payroll-deduction CSV export ---- */
const PRICE_SET = 300;
const PRICE_OKAZU = 200;

function servingWeekdaysInMonth(y, m0){
  const out = [];
  const last = new Date(y, m0+1, 0).getDate();
  for(let d=1; d<=last; d++){
    const dt = new Date(y, m0, d);
    const wd = dt.getDay();
    if(wd!==0 && wd!==6) out.push(iso(y,m0,d));
  }
  return out;
}

async function exportMonthlyCsv(records, yyyyMm){
  const [yStr, mStr] = yyyyMm.split('-');
  const y = parseInt(yStr,10);
  const m0 = parseInt(mStr,10) - 1; // 0-indexed month of the DATA (e.g. June => 5)
  const dataMonthNum = m0 + 1; // 1-12, e.g. June => 6

  // 給与処理回 = data month + 1 (wraps 12 -> 1, and the year rolls over with it)
  let payRound = dataMonthNum + 1;
  let payYear = y;
  if(payRound > 12){ payRound = 1; payYear = y + 1; }

  const specialDays = new Set(await getSpecialPriceDays());
  const servingDays = servingWeekdaysInMonth(y, m0);
  const master = await getEmployeeMaster();
  let missingMealType = 0;

  // cancelled-day set per employee id, built from records (only source of cancellation data)
  const cancelledByEmp = {};
  records.forEach(rec=>{
    const cancelled = new Set();
    (rec.singleDates||[]).forEach(d=>{
      const dt = parseISO(d);
      if(dt.getFullYear()===y && dt.getMonth()===m0) cancelled.add(d);
    });
    (rec.recurring||[]).forEach(rule=>{
      occurrencesInMonth(rule,y,m0).forEach(d=> cancelled.add(d));
    });
    cancelledByEmp[rec.employeeId] = {name:rec.name, cancelled};
  });

  // base employee list: prefer the uploaded roster (includes people who never cancel);
  // fall back to whoever has cancellation records if no roster has been configured.
  const baseList = master.length ? master.map(e=>({id:e.id, name:e.name, mealType:e.mealType}))
                                  : Object.keys(cancelledByEmp).map(id=>({id, name:cancelledByEmp[id].name, mealType:undefined}));

  const perEmployee = {}; // id -> {name, amount}
  baseList.forEach(e=>{
    const mealTypeKnown = e.mealType==='set' || e.mealType==='okazu';
    if(!mealTypeKnown) missingMealType++;
    const basePrice = e.mealType==='set' ? PRICE_SET : PRICE_OKAZU; // defaults to okazu(200) if unknown

    const cancelled = (cancelledByEmp[e.id] && cancelledByEmp[e.id].cancelled) || new Set();
    let amount = 0;
    servingDays.forEach(d=>{
      if(cancelled.has(d)) return; // treated as not eating that day
      amount += specialDays.has(d) ? PRICE_SET : basePrice;
    });

    perEmployee[e.id] = {name:e.name, amount};
  });

  const ids = Object.keys(perEmployee).sort((a,b)=> a.localeCompare(b,'ja',{numeric:true}));

  const EMPTY_TAIL = ',,,,,,,,,,,'; // matches the 11 trailing empty columns in the reference file
  const header = ['社員No','給与処理年','給与処理回','支給グループ','弁当・食品購入代'].join(',') + EMPTY_TAIL;
  const rows = ids.map(id=>{
    const e = perEmployee[id];
    return [id, payYear, payRound, 1, e.amount].join(',') + EMPTY_TAIL;
  });
  const csvBody = [header, ...rows].join('\r\n') + '\r\n';

  const filename = `食品控除データ_${dataMonthNum}月.csv`;

  let blob;
  if(window.Encoding){
    const unicodeArray = Encoding.stringToCode(csvBody);
    const sjisArray = Encoding.convert(unicodeArray, {to:'SJIS', from:'UNICODE'});
    blob = new Blob([new Uint8Array(sjisArray)], {type:'text/csv'});
  } else {
    // fallback: UTF-8 with BOM if the Shift-JIS library failed to load
    blob = new Blob(['\uFEFF'+csvBody], {type:'text/csv'});
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  return { count: ids.length, missingMealType };
}
