<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宮田とうふ工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Shippori+Mincho:wght@700;800&family=Yomogi&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 宮田とうふ工房のサイト配色に合わせた色。
     黄色は面積が広いと文字が読みにくいため、サイトより一段薄くしている。
     濃い色はサイトのボタンと同じこげ茶。 */
  --bg:#FBF8F1;
  --surface:#FFFFFF;
  --line:#E9E3D6;
  --ink:#3B2E24;
  --ink-soft:#786F64;
  --accent:#F2D75E;        /* 薄めの黄色（広い面・数字） */
  --accent-mid:#DFC152;    /* 少し濃い金色（枠線・目印） */
  --accent-line:#EBD79A;   /* 淡い枠線 */
  --accent-soft:#FDF6DA;   /* ごく淡い黄色の塗り */
  --accent-deep:#5D423B;   /* こげ茶（ロゴの文字と同じ色） */
  --accent-deeper:#452F29; /* 濃いこげ茶（見出し・金額） */
  --good:#5E7F3B;
  --good-soft:#EDF2E0;
  --stamp:#B23A2E;
  --danger:#B23A2E;
  --danger-soft:#F4DEDA;
  --radius:14px;
  --shadow: 0 2px 10px rgba(58,43,34,0.08), 0 1px 2px rgba(58,43,34,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(242,215,94,0.20), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Noto Sans JP','Inter',sans-serif;
  min-height:100vh;
  padding:0 0 60px 0;
}
#app{max-width:920px;margin:0 auto;padding:20px 16px 40px;}

.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding:22px 24px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.masthead::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deeper));
}
.masthead-brand{display:flex;align-items:center;gap:16px;}
.brand-logo{height:56px;width:auto;display:block;flex-shrink:0;border-radius:12px;}
@media (max-width:560px){.brand-logo{height:40px;}}
.masthead h1{
  font-family:'Shippori Mincho',serif;
  font-weight:800;
  font-size:25px;
  margin:0;
  letter-spacing:0.1em;
  color:var(--accent-deeper);
  line-height:1.35;
}
@media (max-width:560px){.masthead h1{font-size:21px;letter-spacing:0.08em;}}
.masthead p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.eyebrow{
  font-size:15px;letter-spacing:0.06em;color:var(--accent-deep);
  font-weight:800;margin-bottom:8px;
}
.masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.admin-corner-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  font-family:inherit;font-size:11.5px;font-weight:600;
  padding:6px 12px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:all .15s ease;
}
.admin-corner-btn:hover{border-color:var(--accent-mid);color:var(--ink);background:var(--accent-soft);}
@media (max-width:560px){.admin-corner-btn{font-size:10.5px;padding:5px 9px;}}

.tabbar{
  display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;
}
.tabbtn{
  flex:1;min-width:140px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  border-radius:10px;
  padding:11px 14px;
  font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  text-align:center;
}
.tabbtn.active{
  background:var(--ink);color:#fff;border-color:var(--ink);
}
.tabbtn:hover:not(.active){border-color:var(--accent-mid);color:var(--ink);}

.backlink{
  border:none;background:none;color:var(--ink-soft);font-family:inherit;
  font-size:12.5px;cursor:pointer;padding:0 2px;margin-bottom:14px;
}
.backlink:hover{color:var(--ink);text-decoration:underline;}

.staff-footer{
  text-align:center;margin-top:34px;padding-top:14px;
}
.stafflink{
  border:none;background:none;color:#A9A499;font-family:inherit;
  font-size:11.5px;cursor:pointer;padding:4px 8px;letter-spacing:0.01em;
}
.stafflink:hover{color:var(--ink-soft);text-decoration:underline;}

.mine-card{background:#FDFBF4;}
.mine-toggle{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  user-select:none;
}
.mine-toggle .chev{color:var(--ink-soft);font-size:14px;}
.mine-toggle h2{font-size:16px;color:var(--ink-soft);}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.card h2{
  font-family:'Shippori Mincho',serif;
  font-size:18px;margin:0 0 14px 0;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.card h2 .num{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent-deep);
  font-size:12px;font-weight:800;font-family:'Noto Sans JP',sans-serif;
}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.02em;}
input[type=text],input[type=password],input[type=date],input[type=month],input[type=number],textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:16px;background:#FDFBF5;color:var(--ink);
}
input[type=text]:focus,input[type=password]:focus,input[type=date]:focus{
  outline:2px solid var(--accent-deep);outline-offset:1px;border-color:var(--accent-deep);
}
.field{margin-bottom:14px;}
.field-row{display:flex;gap:10px;align-items:stretch;}
.field-row input{flex:1;min-width:0;}
@media (max-width:480px){.field-row{flex-wrap:wrap;}.field-row input{width:100%;}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.row2{grid-template-columns:1fr;}}
.radiochip{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:14px;cursor:pointer;
  background:#FDFBF5;transition:all .15s ease;
}
.radiochip input{margin:0;accent-color:var(--accent-deep);}
.radiochip.checked{border-color:var(--accent-deep);background:var(--accent-soft);font-weight:600;}

.notice{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  border-radius:10px;padding:12px 14px;margin-bottom:14px;
  font-size:13.5px;line-height:1.55;color:var(--accent-deep);
}
.notice b{display:block;color:var(--accent-deep);}
.notice.danger{background:var(--danger-soft);border-color:var(--danger);color:#7A2A20;}
.notice.good{background:var(--good-soft);border-color:var(--good);color:var(--accent-deep);}

.langtoggle{display:flex;gap:4px;background:#F2EDE0;border-radius:999px;padding:3px;}
.langtoggle button{
  border:none;background:transparent;padding:6px 14px;border-radius:999px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.langtoggle button.active{background:var(--ink);color:#fff;}

.calnav{display:flex;align-items:center;justify-content:space-between;margin:0 auto 10px;max-width:320px;}
.calnav .navbtn{
  border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;
  cursor:pointer;font-size:15px;color:var(--ink);
}
.calnav .navbtn:disabled{opacity:0.3;cursor:not-allowed;}
.calnav .label{font-weight:700;font-size:15px;font-family:'Shippori Mincho',serif;}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px;margin:0 auto;}
.calgrid .wd{
  text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);padding:3px 0;
}
.calcell{
  position:relative;aspect-ratio:1/1;border-radius:7px;border:1px solid var(--line);
  background:#FDFBF5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:11.5px;color:var(--ink);gap:2px;transition:all .12s ease;min-height:32px;max-width:40px;
}
.calcell.outmonth{opacity:0.28;pointer-events:none;}
.calcell.disabled{opacity:0.35;cursor:not-allowed;background:repeating-linear-gradient(135deg,#f2f0ea,#f2f0ea 4px,#eae6da 4px,#eae6da 8px);}
.calcell.today{border-color:var(--accent-mid);border-width:2px;}
.calcell.selected{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep);}
.calcell:hover:not(.disabled):not(.outmonth){border-color:var(--accent-mid);}
.calcell .dot{width:5px;height:5px;border-radius:50%;background:var(--stamp);position:absolute;bottom:4px;}
.calcell .cnt{font-size:10px;font-weight:800;}

.pin-link{
  border:none;background:none;color:var(--ink-soft);font-size:12.5px;
  cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:2px;
  font-family:inherit;
}
.pin-link:hover{color:var(--ink);}
.pin-input-small{max-width:160px;font-size:14px;padding:9px 12px;}

.chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{
  background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;
  padding:5px 10px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.chip button{border:none;background:none;color:var(--accent-deep);cursor:pointer;font-weight:900;padding:0;font-size:13px;}

.weekday-pick{display:flex;gap:6px;flex-wrap:wrap;}
.wdbtn{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;width:40px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.wdbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.wdbtn.off{background:#F7F4EC;color:#B5AEA3;cursor:not-allowed;}

.btn{
  border:none;border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:transform .08s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#241A14;}
.btn-accent{background:var(--accent-deep);color:#fff;}
.btn-accent:hover{background:var(--accent-deeper);}
.btn-submit{
  background:var(--accent-deep);color:#fff;
  width:100%;padding:16px 20px;font-size:16.5px;font-weight:800;
  border-radius:12px;letter-spacing:0.02em;
  box-shadow:0 6px 16px -4px rgba(0,0,0,0.35);
}
.btn-submit:hover{background:var(--accent-deeper);box-shadow:0 8px 20px -4px rgba(0,0,0,0.4);}
.btn-submit:disabled{opacity:0.6;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.checkline{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;font-size:14px;font-weight:600;}
.checkline input{width:17px;height:17px;accent-color:var(--accent-deep);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
th{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;}
tr:hover td{background:#FBF8F0;}

.stamp-overlay{
  position:fixed;inset:0;background:rgba(59,46,36,0.48);
  display:flex;align-items:center;justify-content:center;z-index:50;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stamp-card{
  background:var(--surface);border-radius:16px;padding:36px 40px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);max-width:360px;position:relative;
}
.hanko{
  width:92px;height:92px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;line-height:1.1;
  transform:rotate(-8deg);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1);
  writing-mode:vertical-rl;letter-spacing:2px;
}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.4);opacity:0;}to{transform:rotate(-8deg) scale(1);opacity:1;}}
.stamp-card h3{margin:0 0 6px;font-family:'Shippori Mincho',serif;font-size:19px;}
.stamp-card p{margin:0 0 18px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}

.searchrow{display:flex;gap:8px;}
.searchrow input{flex:1;}

.daylist{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.daylist .item{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px solid #F1EDE2;}
.small{font-size:12px;color:var(--ink-soft);}
.footnote{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
.badge.single{background:var(--good-soft);color:var(--accent-deep);}
.badge.recurring{background:var(--accent-soft);color:var(--accent-deep);}
textarea.csvbox{
  width:100%;min-height:140px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:8px;padding:10px;background:#FDFBF5;
}
.toastmini{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow);z-index:60;
}
.board{
  background:var(--ink);
  border-radius:var(--radius);
  padding:22px 22px 18px;
  margin-bottom:16px;
  color:#fff;
  box-shadow:var(--shadow);
}
.boardnav{
  display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;
}
.boardnav .navbtn{
  border:1px solid rgba(255,255,255,0.28);background:rgba(255,255,255,0.06);
  color:#F7EDD2;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;
  flex-shrink:0;font-family:inherit;
}
.boardnav .navbtn:hover{background:rgba(255,255,255,0.16);}
.boardnav .d{
  font-size:13.5px;letter-spacing:0.04em;color:#E4CE8B;font-weight:700;
}
.boardnav .todaypill{
  background:rgba(242,215,94,0.26);color:#F7E9A8;border-radius:999px;
  padding:2px 9px;font-size:11px;font-weight:700;
}
.boardnav .backtoday{
  border:1px solid rgba(255,255,255,0.28);background:transparent;color:#EBDCAE;
  border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.boardnav .backtoday:hover{background:rgba(255,255,255,0.12);}
.board-date{font-size:12.5px;letter-spacing:0.04em;color:#E4CE8B;margin-bottom:16px;font-weight:600;}
.board-main{text-align:center;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.14);}
.board-main-num{
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:58px;color:var(--accent);line-height:1;
}
.board-main-lbl{font-size:14px;margin-top:8px;color:#F7EDD2;font-weight:600;}
.board-main-sub{font-size:13px;margin-top:8px;color:#EBDCAE;}
.board-sub{text-align:center;}
.board-sub-num{
  font-family:'Shippori Mincho',serif;font-weight:700;font-size:26px;color:#E6A08E;line-height:1;
}
.board-sub-lbl{font-size:12px;margin-top:4px;color:#D6C79A;}
.board-sub-sub{font-size:11.5px;margin-top:4px;color:#C6B48A;}
.status-msg{font-size:12.5px;color:var(--ink-soft);min-height:16px;margin-top:6px;}

/* ---- Mobile tuning (phones) ---- */
@media (max-width:480px){
  #app{padding:12px 10px 32px;}
  .masthead{padding:16px 16px 16px 20px;}
  .masthead-brand{gap:10px;}
  .brand-logo{height:34px;}
  .masthead h1{font-size:19px;letter-spacing:0.07em;}
  .admin-corner-btn{padding:5px 10px;font-size:10.5px;}
  .card{padding:16px;}
  .card h2{font-size:16px;margin-bottom:12px;}
  .btn{padding:12px 16px;font-size:14px;}
  .btn-submit{padding:15px 18px;font-size:16px;}
  .wdbtn{width:36px;padding:10px 0;font-size:12px;}
  .calcell{min-height:38px;}
  .board-main-num{font-size:46px;}
  .board-sub-num{font-size:22px;}
  .notice{font-size:13px;padding:11px 12px;}
}

/* ================= 追加分（停止期間・休業日・確認画面・控除見込み） ================= */
.calcell.weekend{
  background:#F7F4EC;color:#B5AEA3;cursor:not-allowed;
}
.calcell.closed{
  background:repeating-linear-gradient(135deg,#efeade,#efeade 4px,#e2dbc9 4px,#e2dbc9 8px);
  opacity:0.5;cursor:not-allowed;
}
.callegend{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin-top:10px;font-size:11px;color:var(--ink-soft);
}
.callegend span{display:flex;align-items:center;gap:5px;}
.legend-swatch{
  width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block;
}
.legend-swatch.weekend{background:#F7F4EC;}
.legend-swatch.closed{background:repeating-linear-gradient(135deg,#efeade,#efeade 4px,#e2dbc9 4px,#e2dbc9 8px);}
.legend-swatch.sel{background:var(--accent-deep);border-color:var(--accent-deep);}

.sumgrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;
}
@media (max-width:560px){.sumgrid{grid-template-columns:1fr;}}
.sumbox{
  border:1px solid var(--line);border-radius:10px;background:#FDFBF5;
  padding:14px 14px 12px;text-align:center;
}
.sumbox .n{
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;line-height:1;color:var(--accent-deep);
}
.sumbox .l{font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-weight:700;letter-spacing:0.02em;}
.sumbox .s{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.sumbox.money{background:var(--accent-soft);border-color:var(--accent-line);}
.sumbox.money .n{color:var(--accent-deeper);}

.cardq-head{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:10px;
}
.cardq-head h2{font-size:15px;color:var(--ink-soft);margin:0;}
.cardq-head .chev{color:var(--ink-soft);font-size:13px;flex-shrink:0;}
.cardq{background:#FDFBF4;}
.cardq-head:hover h2{color:var(--ink);}
.recdisclose{
  margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
}
.recpanel{
  background:#FDFBF5;border:1px solid var(--line);border-radius:10px;padding:14px;
}
.gate{
  border:1px solid var(--line);background:#FDFBF5;border-radius:12px;padding:18px;
}
.gate h3{
  margin:0 0 6px;font-family:'Shippori Mincho',serif;font-size:16px;
}
.gate p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
.pinfield input{
  max-width:170px;font-size:22px;letter-spacing:0.4em;text-align:center;
  font-variant-numeric:tabular-nums;padding:12px 10px;
}
.gate .who{
  display:inline-block;background:var(--accent-soft);color:var(--accent-deep);
  border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;margin-bottom:12px;
}
.minilink{
  border:none;background:none;color:var(--ink-soft);font-family:inherit;font-size:11.5px;
  cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px;
}
.minilink:hover{color:var(--ink);}
.statuspill{

.badge.out{background:#EFEADE;color:#7A7065;}

const today = new Date();
function pad(n){return String(n).padStart(2,'0');}
function iso(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayISO(){return iso(today.getFullYear(),today.getMonth(),today.getDate());}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function yesterdayISO(){
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-1);
  return iso(d.getFullYear(), d.getMonth(), d.getDate());
}
function currentMonthValue(){return `${today.getFullYear()}-${pad(today.getMonth()+1)}`;}

/* ============================================================
   BACKEND STORAGE ADAPTER
   Google Apps Script をデータの保存先として使う。
   ============================================================ */

// ↓↓↓ ここに、あなたがデプロイしたApps ScriptのウェブアプリURL（.../exec）を貼り付けてください ↓↓↓
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxFGK5gvtf00r2EBYynEMZGWFOvhqMs4JDtqPWPwDvvOactaLBgc2ACuJ-8weJqqXnxWg/exec";
// ↑↑↑ ここまで ↑↑↑

let backendWarningShown = false;
function warnBackendNotConfigured(){
  if(backendWarningShown) return;
  backendWarningShown = true;
  console.error('BACKEND_URL が設定されていません。ファイル内の BACKEND_URL 定数にApps ScriptのURLを貼り付けてください。');
}

async function kvRequest(action, extra, attempt){
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR_') === 0){
    warnBackendNotConfigured();
    return null;
  }
  attempt = attempt || 0;
  const retry = async ()=>{
    if(attempt >= 2) return null;
    await new Promise(r=>setTimeout(r, 700 * (attempt + 1)));
    return kvRequest(action, extra, attempt + 1);
  };
  try{
    const params = new URLSearchParams();
    params.set('action', action);
    if(extra){
      if(extra.key !== undefined) params.set('key', extra.key);
      if(extra.value !== undefined) params.set('value', extra.value);
      if(extra.prefix !== undefined) params.set('prefix', extra.prefix);
      if(extra.payload !== undefined) params.set('payload', JSON.stringify(extra.payload));
    }
    const res = await fetch(BACKEND_URL + '?' + params.toString(), { method:'GET' });
    const data = await res.json();
    // 書き込みが混み合っていた場合は少し待ってやり直す。
    // 同じ内容を書き直すだけなので、二重に登録されることはない。
    if(data && data.error === 'busy') return await retry();
    return data;
  }catch(e){
    console.error('kvRequest failed:', action, e);
    return await retry();
  }
}

async function getEmp(id){
  const r = await kvRequest('kvGet', {key:'emp:'+id});
  if(r && r.found){
    try{ return JSON.parse(r.value); }catch(e){ return null; }
  }
  return null;
}
async function setEmp(id, record){
  const r = await kvRequest('kvSet', {key:'emp:'+id, value: JSON.stringify(record)});
  return !!(r && r.ok);
}
async function listAllEmpRecords(){
  const r = await kvRequest('kvGetByPrefix', {prefix:'emp:'});
  const items = (r && r.items) || [];
  const out = [];
  for(const item of items){
    try{ out.push(JSON.parse(item.value)); }catch(e){}
  }
  return out;
}

// 「社員番号・氏名を端末に記憶する」機能は、共有データベースではなく
// このブラウザだけのlocalStorageを使う（他の人のデータと混ざらないように）。
async function persistEmpProfile(){
  try{
    if(state.empId) localStorage.setItem('my_emp_id', state.empId);
    if(state.empName) localStorage.setItem('my_emp_name', state.empName);
  }catch(e){ /* best-effort only */ }
}
async function loadEmpProfile(){
  try{
    const id = localStorage.getItem('my_emp_id');
    const name = localStorage.getItem('my_emp_name');
    if(id) state.empId = id;
    if(name) state.empName = name;
  }catch(e){ /* no saved profile yet, or storage unavailable */ }
}

async function getSetting(key){
  const r = await kvRequest('kvGet', {key:'settings:'+key});
  return (r && r.found) ? r.value : '';
}
async function setSetting(key,val){
  const r = await kvRequest('kvSet', {key:'settings:'+key, value: val});
  return !!(r && r.ok);
}
// 従業員名簿はスプレッドシート側で管理しているため、ここは空にしてあります。
// （このファイルは公開URLから誰でも読めるため、実名を置かない方針）
const SEED_EMPLOYEE_MASTER = [];

// items(配列)を小分けにして kvSetMany へ送る（1リクエストのURLが長くなりすぎないように）
async function kvSetManyChunked(items, chunkSize){
  chunkSize = chunkSize || 15;
  for(let i=0; i<items.length; i+=chunkSize){
    const chunk = items.slice(i, i+chunkSize);
    await kvRequest('kvSetMany', {payload: chunk});
  }
}

async function ensureEmployeeMasterSeeded(){
  // 初期投入は済んでいるので、通常は何もしない。
  // （毎回ここで名簿を全件読み込むと、人数分の無駄な通信になる）
  if(!SEED_EMPLOYEE_MASTER.length) return;
  try{
    const existing = await getEmployeeMaster();
    const existingIds = new Set(existing.map(e=>String(e.id)));
    const toAdd = SEED_EMPLOYEE_MASTER.filter(e=>!existingIds.has(String(e.id)));
    if(toAdd.length===0) return;
    const items = toAdd.map(e=>({key:'master:'+e.id, value: JSON.stringify(e)}));
    await kvSetManyChunked(items);
  }catch(e){ /* best-effort seeding only */ }
}

async function getEmployeeMaster(){
  try{
    const r = await kvRequest('kvGetByPrefix', {prefix:'master:'});
    const items = (r && r.items) || [];
    const out = [];
    for(const item of items){
      try{ out.push(JSON.parse(item.value)); }catch(e){}
    }
    return out;
  }catch(e){ return []; }
}

}
// 従業員マスタを保存し直す（まとめて少ない通信回数で送る）
async function setEmployeeMaster(list){
  const existing = await getEmployeeMaster();
  const existingIds = new Set(existing.map(e=>String(e.id)));
  const newIds = new Set(list.map(e=>String(e.id)));
  // 削除された人を消す
  for(const id of existingIds){
    if(!newIds.has(id)) await kvRequest('kvDelete', {key:'master:'+id});
  }
  // 追加・更新をまとめて送信
  const items = list.map(e=>({key:'master:'+e.id, value: JSON.stringify(e)}));
  await kvSetManyChunked(items);
  return true;
}

/* ============================================================
   閲覧用PIN（4桁）
   ・PINそのものは保存せず、ソルト付きのハッシュだけを保存する
   ・間違えた回数もサーバ側（スプレッドシート）に記録するので、
     ページを再読み込みしても回避できない
   ============================================================ */
const DEVICE_TRUST_DAYS = 14;   // 一度PINを通した端末で入力を省略する日数
const PIN_MAX_FAILS = 5;        // 何回間違えたらロックするか
const PIN_LOCK_MINUTES = 10;    // ロックする時間（分）

async function getPinRecord(id){
  const r = await kvRequest('kvGet', {key:'pin:'+id});
  if(r && r.found){
    try{ return JSON.parse(r.value); }catch(e){ return null; }
  }
  return null;
}
async function setPinRecord(id, rec){
  const r = await kvRequest('kvSet', {key:'pin:'+id, value: JSON.stringify(rec)});
  return !!(r && r.ok);
}
async function deletePinRecord(id){
  const r = await kvRequest('kvDelete', {key:'pin:'+id});
  return !!(r && r.ok);
}
async function listPinRecords(){
  const r = await kvRequest('kvGetByPrefix', {prefix:'pin:'});
  const items = (r && r.items) || [];
  const out = {};
  for(const item of items){
    try{ out[String(item.key).slice(4)] = JSON.parse(item.value); }catch(e){}
  }
  return out;
}

function randomSalt(){
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}
function hasWebCrypto(){
  return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
}
// SHA-256が使えない環境（file:// で開いた場合など）でも動くように予備の方式を持つ
function fallbackHash(str){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 = (h1 ^ c) * 16777619 >>> 0;
    h2 = ((h2 << 5) + h2 + c) >>> 0;
  }
  return ('00000000'+h1.toString(16)).slice(-8) + ('00000000'+h2.toString(16)).slice(-8);
}
async function hashPin(pin, salt, alg){
  const src = salt + ':' + pin;
  if(alg === 'sha256' && hasWebCrypto()){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(src));
    return Array.from(new Uint8Array(buf)).map(b=>('0'+b.toString(16)).slice(-2)).join('');
  }
  return fallbackHash(src);
}
function pinLockRemainMinutes(rec){
  if(!rec || !rec.lockedUntil) return 0;
  const diff = new Date(rec.lockedUntil).getTime() - Date.now();
  return diff > 0 ? Math.ceil(diff/60000) : 0;
}
async function savePin(id, pin){
  const alg = hasWebCrypto() ? 'sha256' : 'fallback';
  const salt = randomSalt();
  const hash = await hashPin(pin, salt, alg);
  return await setPinRecord(id, {
    alg, salt, hash, fails:0, lockedUntil:null, updatedAt:new Date().toISOString(),
  });
}
// {status:'ok'|'wrong'|'locked'|'none', left, minutes}
async function verifyPin(id, pin){
  const rec = await getPinRecord(id);
  if(!rec) return {status:'none'};
  const locked = pinLockRemainMinutes(rec);
  if(locked > 0) return {status:'locked', minutes:locked};

  const hash = await hashPin(pin, rec.salt, rec.alg);
  if(hash === rec.hash){
    if(rec.fails || rec.lockedUntil){
      rec.fails = 0; rec.lockedUntil = null;
      await setPinRecord(id, rec);
    }
    return {status:'ok'};
  }
  rec.fails = Number(rec.fails||0) + 1;
  if(rec.fails >= PIN_MAX_FAILS){
    rec.fails = 0;
    rec.lockedUntil = new Date(Date.now() + PIN_LOCK_MINUTES*60000).toISOString();
    await setPinRecord(id, rec);
    return {status:'locked', minutes:PIN_LOCK_MINUTES};
  }
  await setPinRecord(id, rec);
  return {status:'wrong', left: PIN_MAX_FAILS - rec.fails};
}

/* この端末を信頼する（localStorageなので、この端末の中だけの話） */
function deviceKey(id){ return 'pin_ok:' + id; }
function isDeviceTrusted(id, name){
  try{
    const raw = localStorage.getItem(deviceKey(id));
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o.until || new Date(o.until).getTime() < Date.now()) return false;
    return normName(o.name||'') === normName(name);
  }catch(e){ return false; }
}
function trustDevice(id, name){
  try{
    localStorage.setItem(deviceKey(id), JSON.stringify({
      name, until: new Date(Date.now() + DEVICE_TRUST_DAYS*86400000).toISOString(),
    }));
  }catch(e){ /* 保存できなくても、毎回PINを入れれば使える */ }
}
function forgetDevice(id){
  try{ localStorage.removeItem(deviceKey(id)); }catch(e){}
}

/* ===================== 名前・日付のゆらぎ吸収 ===================== */
// 全角/半角スペース・大文字小文字の違いを無視して氏名を比較する
function normName(s){
  return String(s??'').replace(/[\s\u3000]/g,'').toLowerCase();
}
// 2026/8/1・2026年8月1日 なども 2026-08-01 に揃える。読めなければ null
function normDate(s){
  const raw = String(s??'').trim();
  if(!raw) return '';
  const t = raw.replace(/年|月/g,'-').replace(/日/g,'').replace(/\//g,'-').replace(/\./g,'-').replace(/-+$/,'');
  const m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  return `${m[1]}-${pad(Number(m[2]))}-${pad(Number(m[3]))}`;
}

// 給食がある日か（土日と休業日は給食なし）
function isLunchDay(dateStr){
  const wd = parseISO(dateStr).getDay();
  if(wd === 0 || wd === 6) return false;
  return !(state.closedDays || []).includes(dateStr);
}
// 社員がカレンダーで選べる日か（給食があり、まだ締切前）
function canPickDate(dateStr){
  return isLunchDay(dateStr) && !isPastCutoff(dateStr);
}

// 停止期間：停止開始日 〜 再開日の前日 まで（再開日は「食べ始める日」）
function isPausedOn(emp, dateStr){
  if(!emp || !emp.pauseStart) return false;
  if(dateStr < emp.pauseStart) return false;
  if(emp.pauseEnd && dateStr >= emp.pauseEnd) return false;
  return true;
}
function pauseLabel(emp, lang){
  if(!emp || !emp.pauseStart) return '';
  const end = emp.pauseEnd ? emp.pauseEnd : (lang==='en' ? 'ongoing' : '未定');
  return (lang==='en' ? 'Paused ' : '停止 ') + emp.pauseStart + '〜' + end;
}

// returns null (no master configured => skip check), or {ok, reason, emp}
async function checkAgainstMaster(id, name){
  // まずその社員1名分だけを読む（名簿全件を読まないので速い）
  const one = await getMasterEmp(id);
  if(one){
    if(normName(one.name) !== normName(name)) return {ok:false, reason:'mismatch'};
    return {ok:true, emp:one};
  }
  // 見つからないときだけ、名簿そのものが未登録かどうかを確かめる
  const master = await getEmployeeMaster();
  if(!master || master.length===0) return null; // 名簿が空なら照合しない
  return {ok:false, reason:'not_found'};
}

/* ===================== date logic ===================== */
function isPastCutoff(dateISOStr){
  const t = todayISO();
  if(dateISOStr < t) return true;
  if(dateISOStr === t){
    const now = new Date();
    return now.getHours() >= 8;
  }
  return false;
}
function monthLabel(y,m,lang){
  const monthsEn = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return lang==='ja' ? `${y}年${m+1}月` : `${monthsEn[m]} ${y}`;
}
function dowLabel(dateStr, lang){
  const names = (T[lang]||T.ja).weekdayShort || T.ja.weekdayShort;
  return names[parseISO(dateStr).getDay()];
}
function buildMonthGrid(y,m){
  const first = new Date(y,m,1);
  const startWd = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startWd;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(iso(y,m,d));
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function occurrencesInMonth(rule, y, m){
  const daysInMonth = new Date(y,m+1,0).getDate();
  const out = [];
  const start = rule.start ? parseISO(rule.start) : null;
  const end = rule.end ? parseISO(rule.end) : null;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d);
    const wd = dt.getDay();
    if(!rule.weekdays.includes(wd)) continue;
    if(start && dt < new Date(start.getFullYear(),start.getMonth(),start.getDate())) continue;
    if(end && dt > new Date(end.getFullYear(),end.getMonth(),end.getDate())) continue;
    out.push(iso(y,m,d));
  }
  return out;
}
// 給食のある日＝平日から休業日を除いた日
function servingDaysInMonth(y, m0, closedSet){
  const out = [];
  const last = new Date(y, m0+1, 0).getDate();
  for(let d=1; d<=last; d++){
    const dstr = iso(y,m0,d);
    const wd = new Date(y,m0,d).getDay();
    if(wd===0 || wd===6) continue;
    if(closedSet && closedSet.has(dstr)) continue;
    out.push(dstr);
  }
  return out;
}
// その社員が実際に食べた日と金額（社員側の見込み表示・CSV出力の両方で使う）
function calcForEmployee(emp, cancelledSet, servingDays, specialSet){
  // ランチを利用しない人（利用なし）は、給食日があっても金額計算の対象にしない
  if(emp && emp.mealType === 'none'){
    return {eatDays:0, amount:0, pausedDays:0, cancelledDays:0};
  }
  const basePrice = emp && emp.mealType==='set' ? PRICE_SET : PRICE_OKAZU;
  let eatDays=0, amount=0, pausedDays=0, cancelledDays=0;
  servingDays.forEach(d=>{
    if(isPausedOn(emp, d)){ pausedDays++; return; }
    if(cancelledSet.has(d)){ cancelledDays++; return; }
    eatDays++;
    amount += (specialSet && specialSet.has(d)) ? PRICE_SET : basePrice;
  });
  return {eatDays, amount, pausedDays, cancelledDays};
}
// 割引商品の購入：その月の分だけ取り出す
function purchasesInMonth(rec, y, m0){
  return ((rec && rec.purchases) || []).filter(p=>{
    if(!p || !p.date) return false;
    const dt = parseISO(p.date);
    return dt.getFullYear()===y && dt.getMonth()===m0;
  }).sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}
function purchaseTotal(list){
  return (list||[]).reduce((s,p)=> s + Number(p.total||0), 0);
}
// その月の購入を単価ごとにまとめる（例：¥100×2、¥250×1）
function aggregatePurchaseItems(list){
  const map = new Map();
  (list||[]).forEach(p=>(p.items||[]).forEach(it=>{
    const price = Number(it.price);
    map.set(price, (map.get(price)||0) + Number(it.qty||0));
  }));
  const entries = Array.from(map.entries()).sort((a,b)=>a[0]-b[0]);
  return {
    pieces: entries.reduce((n,[,q])=>n+q, 0),
    text: entries.map(([price,qty])=>`¥${price}×${qty}`).join('、'),
  };
}
// キャンセルの内訳（0件の側は書かない）
function cancelBreakdownText(summary, t){
  const parts = [];
  if(summary.single > 0) parts.push(t.breakdownSingle.replace('{n}', summary.single));
  if(summary.recurring > 0) parts.push(t.breakdownRecurring.replace('{n}', summary.recurring));
  return parts.length ? `（${parts.join('・')}）` : '';
}
function purchaseItemsText(p){
  return (p.items||[]).map(it=>`¥${it.price}×${it.qty}`).join('、');
}

// 記録から、その月のキャンセル日を「個別」「定期」に分けて集める
function cancelledSetsForMonth(rec, y, m0){
  const single = new Set();
  const recurring = new Set();
  if(!rec) return {single, recurring, all:new Set()};
  (rec.singleDates||[]).forEach(d=>{
    const dt = parseISO(d);
    if(dt.getFullYear()===y && dt.getMonth()===m0) single.add(d);
  });
  (rec.recurring||[]).forEach(rule=>{
    occurrencesInMonth(rule, y, m0).forEach(d=>{ if(!single.has(d)) recurring.add(d); });
  });
  const all = new Set([...single, ...recurring]);
  return {single, recurring, all};
}

/* ---- 割引商品の購入：個数と合計 ---- */
// 送信した日付と時刻（例：2026-08-05 09:12:34）
function nowLocalStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
// 対象月（0始まり）の分が天引きされる月
function payrollMonthOf(m0){
  const m = m0 + 2;
  return m > 12 ? m - 12 : m;
}
function purchaseSumFromState(){
  return PRICE_OPTIONS.reduce((sum,p)=> sum + p * Number(state.purchaseQty[p]||0), 0);
}
function purchaseItemsFromState(){
  return PRICE_OPTIONS
    .map(p=>({price:p, qty:Number(state.purchaseQty[p]||0)}))
    .filter(it=>it.qty > 0);
}
// 個数や氏名を触ったら最終確認をやり直す（古い内容のまま送信されないように）
function resetPurchaseConfirm(){
  if(!state.purchaseConfirm) return;
  state.purchaseConfirm = false;
  state.purchasePin = ''; state.purchasePin2 = ''; state.purchasePinMsg = null;
  render();   // PIN入力欄も含めて描き直す
}
function setQty(price, raw, writeInput){
  let q = Math.floor(Number(raw));
  if(!isFinite(q) || q < 0) q = 0;
  if(q > 999) q = 999;
  state.purchaseQty[price] = q;
  resetPurchaseConfirm();
  const inp = document.getElementById('qty-'+price);
  if(inp && writeInput) inp.value = q;
  const sub = document.getElementById('sub-'+price);
  if(sub) sub.textContent = '¥' + (q*price).toLocaleString();
  const row = document.querySelector('.pricerow[data-row="'+price+'"]');
  if(row) row.classList.toggle('has', q>0);
  const tot = document.getElementById('pur-total');
  if(tot) tot.textContent = '¥' + purchaseSumFromState().toLocaleString();
}

async function submitPurchase(){
  const t = T[state.lang];
  state.msg = null;
  if(!state.empId.trim() || !state.empName.trim()){
    state.msg = t.needIdName; render(); return;
  }
  const items = purchaseItemsFromState();
  if(items.length === 0){
    state.msg = t.needQty; render(); return;
  }
  const id = state.empId.trim();
  const [masterCheck, pinRecFirst] = await Promise.all([
    checkAgainstMaster(id, state.empName.trim()),
    state.purchaseConfirm ? Promise.resolve(null) : getPinRecord(id)
  ]);
  if(masterCheck && !masterCheck.ok){
    state.msg = masterCheck.reason==='not_found' ? t.masterNotFound : t.masterMismatch;
    render(); return;
  }

  // 1回目は最終確認とPIN入力を出して止める。2回目で送信する。
  if(!state.purchaseConfirm){
    const pinRec = pinRecFirst;
    if(!pinRec){
      state.purchasePinMode = 'set';
    } else {
      const lock = pinLockRemainMinutes(pinRec);
      state.purchasePinMode = lock > 0 ? 'locked' : 'enter';
      state.purchaseLockMin = lock;
    }
    state.purchasePin = ''; state.purchasePin2 = ''; state.purchasePinMsg = null;
    state.purchaseConfirm = true;
    render();
    const note = document.getElementById('pur-confirm-note');
    if(note && note.scrollIntoView) note.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  // 2回目：PINで本人確認する
  if(state.purchasePinMode === 'locked'){
    state.purchaseLockMin = pinLockRemainMinutes(await getPinRecord(id));
    if(state.purchaseLockMin > 0){ render(); return; }
    state.purchasePinMode = 'enter';   // ロックが明けた
  }
  if(state.purchasePinMode === 'set'){
    if(!/^\d{4}$/.test(state.purchasePin)){ state.purchasePinMsg = t.pinNeed4; render(); return; }
    if(state.purchasePin !== state.purchasePin2){ state.purchasePinMsg = t.pinNotMatch; render(); return; }
    const already = await getPinRecord(id);
    if(already){                        // 途中で誰かが設定した場合
      state.purchasePinMode = 'enter'; state.purchasePin = ''; state.purchasePin2 = '';
      state.purchasePinMsg = null; render(); return;
    }
    await savePin(id, state.purchasePin);
  } else {
    if(!/^\d{4}$/.test(state.purchasePin)){ state.purchasePinMsg = t.pinNeed4; render(); return; }
    const res = await verifyPin(id, state.purchasePin);
    if(res.status === 'locked'){
      state.purchasePinMode = 'locked'; state.purchaseLockMin = res.minutes;
      state.purchasePin = ''; render(); return;
    }
    if(res.status === 'none'){         // 担当者がリセットした直後
      state.purchasePinMode = 'set'; state.purchasePin = ''; state.purchasePin2 = '';
      state.purchasePinMsg = null; render(); return;
    }
    if(res.status !== 'ok'){
      state.purchasePin = '';
      state.purchasePinMsg = t.pinWrong.replace('{n}', res.left);
      render(); return;
    }
  }

  state.purchaseConfirm = false;
  state.purchasePin = ''; state.purchasePin2 = ''; state.purchasePinMsg = null;
  state.submitting = true; render();

  const total = items.reduce((s,it)=> s + it.price*it.qty, 0);
  const entry = {
    id: 'p'+Date.now(),
    date: todayISO(),                 // 集計に使う日付（送信日）
    submittedAt: nowLocalStamp(),     // 送信した日付と時刻（記録用）
    items, total,
    createdAt: new Date().toISOString(),
  };

  const existing = (await getEmp(id)) || {employeeId:id, name:state.empName.trim(), singleDates:[], recurring:[]};
  existing.name = state.empName.trim();
  existing.purchases = existing.purchases || [];
  existing.purchases.push(entry);
  existing.updatedAt = new Date().toISOString();
  const savedPurchase = await setEmp(id, existing);
  if(!savedPurchase){
    state.submitting = false;
    state.msg = t.saveFailed;
    render(); return;
  }

  // fire-and-forget push to Google Sheets if configured
  kvRequest('logPurchase', {payload:{
    employeeId:id, name:existing.name, date:entry.date, items:entry.items, total:entry.total,
    submittedAt:entry.submittedAt, timestamp:entry.createdAt,
  }});

  state.submitting = false;
  state.purchaseQty = {};
  state.purchasePin = ''; state.purchasePin2 = ''; state.purchasePinMsg = null;
  if(state.mineSearched && normName(state.mineId)===normName(id)) state.mineSearched = false;
  render();
  showStamp(t.successTitle, t.purchaseSuccessBody);
}

async function submitCancellation(){
  const t = T[state.lang];
  state.msg = null;
  if(!state.empId.trim() || !state.empName.trim()){
    state.msg = t.needIdName; render(); return;
  }
  const pickedDates = Array.from(state.selectedDates).filter(d=>isLunchDay(d));
  const hasSingle = pickedDates.length > 0;
  const hasRecurring = state.recurringOn && state.recurringWd.size > 0;
  if(!hasSingle && !hasRecurring){
    state.msg = t.needDates; render(); return;
  }

  const id = state.empId.trim();

  // 名簿の照合と既存記録の取得は互いに関係ないので同時に投げる
  const [masterCheck, current] = await Promise.all([
    checkAgainstMaster(id, state.empName.trim()),
    getEmp(id)
  ]);
  if(masterCheck && !masterCheck.ok){
    state.msg = masterCheck.reason==='not_found' ? t.masterNotFound : t.masterMismatch;
    render(); return;
  }

  state.submitting = true; render();

  const existing = current || {employeeId:id, name:state.empName.trim(), singleDates:[], recurring:[]};
  existing.name = state.empName.trim();
  const singleSet = new Set(existing.singleDates || []);
  pickedDates.forEach(d=>singleSet.add(d));
  existing.singleDates = Array.from(singleSet).sort();

  if(hasRecurring){
    existing.recurring = existing.recurring || [];
    existing.recurring.push({
      id: 'r'+Date.now(),
      weekdays: Array.from(state.recurringWd).filter(i=>i!==0 && i!==6).sort(),
      start: state.recurringStart || todayISO(),
      end: state.recurringEnd || null,
    });
  }
  existing.updatedAt = new Date().toISOString();

  const saved = await setEmp(id, existing);
  if(!saved){
    state.submitting = false;
    state.msg = t.saveFailed;
    render(); return;
  }

  // fire-and-forget push to Google Sheets if configured
  pushToSheet({
    employeeId: id, name: existing.name,
    singleDates: pickedDates,
    recurring: hasRecurring ? [{
      weekdays: Array.from(state.recurringWd).filter(i=>i!==0 && i!==6),
      start: state.recurringStart || todayISO(),
      end: state.recurringEnd || null,
    }] : [],
    timestamp: new Date().toISOString(),
  });

  state.submitting = false;
  state.selectedDates = new Set();
  state.recurringOn = false; state.recurringWd = new Set(); state.recurringEnd='';
  // 記録欄を開いていたら、最新の内容に更新する
  if(state.mineSearched && normName(state.mineId)===normName(id)) state.mineSearched = false;
  render();
  showStamp(t.successTitle, t.successBody);
}

async function pushToSheet(payload){
  await kvRequest('logCancellation', {payload: payload});
}

async function runMineSearch(){
  const t = T[state.lang];
  const id = state.mineId.trim();
  const name = state.mineName.trim();
  state.mineSearched = true;
  state.mineError = null; state.mineRecord = null; state.mineMaster = null; state.mineSummary = null;
  state.mineStage = 'search'; state.minePin = ''; state.minePin2 = '';
  state.minePinMsg = null; state.minePinNotice = null; state.minePinChangeOpen = false;

  if(!id || !name){ state.mineError = t.mineNeedIdName; return; }

  const [master, rec, pinRec] = await Promise.all([getMasterEmp(id), getEmp(id), getPinRecord(id)]);
  if(master){
    if(normName(master.name) !== normName(name)){ state.mineError = t.mineNameMismatch; return; }
  } else if(rec){
    if(normName(rec.name) !== normName(name)){ state.mineError = t.mineNameMismatch; return; }
  } else {
    state.mineError = t.mineNotFound; return;
  }
  state.mineMaster = master;
  state.mineRecord = rec;

  // ここからPINによる本人確認（上でまとめて取得済み）
  if(!pinRec){                       // まだPINを設定していない人
    state.mineStage = 'setPin';
    return;
  }
  const locked = pinLockRemainMinutes(pinRec);
  if(locked > 0){
    state.mineStage = 'locked'; state.mineLockUntil = locked;
    return;
  }
  if(isDeviceTrusted(id, name)){     // この端末では前回PINを通している
    state.mineStage = 'view';
    await computeMineSummary();
    return;
  }
  state.mineStage = 'enterPin';
}

async function computeMineSummary(){
  const [closed, special] = await Promise.all([getClosedDays(), getSpecialPriceDays()]);
  state.closedDays = closed;
  const [ys, ms] = (state.mineMonth || currentMonthValue()).split('-');
  const y = parseInt(ys,10), m0 = parseInt(ms,10)-1;
  const closedSet = new Set(closed), specialSet = new Set(special);
  const serving = servingDaysInMonth(y, m0, closedSet);
  const sets = cancelledSetsForMonth(state.mineRecord, y, m0);
  const emp = state.mineMaster || {};
  const calc = calcForEmployee(emp, sets.all, serving, specialSet);

  let single = 0, recurring = 0;
  serving.forEach(d=>{
    if(isPausedOn(emp, d)) return;
    if(sets.single.has(d)) single++;
    else if(sets.recurring.has(d)) recurring++;
  });

  const purchases = purchasesInMonth(state.mineRecord, y, m0);
  const purchaseAmount = purchaseTotal(purchases);
  const purchaseAgg = aggregatePurchaseItems(purchases);

  // その月に登録されている個別キャンセル日（金額に入らない日も一覧には出す）
  const singleDatesInMonth = Array.from(sets.single).sort();
  const servingSet = new Set(serving);

  state.mineSummary = {
    y, m0, servingCount: serving.length,
    singleDatesInMonth, servingSet,
    eatDays: calc.eatDays,
    lunchAmount: calc.amount,
    purchaseAmount,
    amount: calc.amount + purchaseAmount,
    pausedDays: calc.pausedDays, cancelledDays: calc.cancelledDays,
    single, recurring, mealType: emp.mealType,
    purchases, purchaseAgg,
  };
}

      <div class="status-msg">${state.minePinMsg ? `<span style="color:var(--danger)">${state.minePinMsg}</span>` : ''}</div>
    </div>
  `;
  const pin1 = box.querySelector('#gate-pin');
  const digits = v => v.replace(/[^0-9]/g,'').slice(0,4);
  pin1.oninput = e=>{ state.minePin = digits(e.target.value); e.target.value = state.minePin; };
  const pin2 = box.querySelector('#gate-pin2');
  if(pin2) pin2.oninput = e=>{ state.minePin2 = digits(e.target.value); e.target.value = state.minePin2; };
  box.querySelector('#gate-remember').onchange = e=>{ state.mineRemember = e.target.checked; };
  const go = box.querySelector('#gate-go');
  const submit = ()=> isSetup ? submitNewPin() : submitPinCheck();
  go.onclick = submit;
  (pin2 || pin1).onkeydown = e=>{ if(e.key==='Enter') submit(); };
  pin1.focus();
}

async function submitNewPin(){
  const t = T[state.lang];
  const id = state.mineId.trim();
  if(!/^\d{4}$/.test(state.minePin)){ state.minePinMsg = t.pinNeed4; paintMineResult(); return; }
  if(state.minePin !== state.minePin2){ state.minePinMsg = t.pinNotMatch; paintMineResult(); return; }

  // 設定の直前にもう一度確認する（別の人が同時に設定していた場合に上書きしないため）
  const existing = await getPinRecord(id);
  if(existing){
    state.mineStage = 'enterPin'; state.minePin = ''; state.minePin2 = '';
    state.minePinMsg = null; paintMineResult(); return;
  }
  await savePin(id, state.minePin);
  if(state.mineRemember) trustDevice(id, state.mineName.trim());
  state.minePin = ''; state.minePin2 = ''; state.minePinMsg = null;
  state.mineStage = 'view';
  await computeMineSummary();
  paintMineResult();
}

async function submitPinCheck(){
  const t = T[state.lang];
  const id = state.mineId.trim();
  if(!/^\d{4}$/.test(state.minePin)){ state.minePinMsg = t.pinNeed4; paintMineResult(); return; }
  const res = await verifyPin(id, state.minePin);
  if(res.status === 'ok'){
    if(state.mineRemember) trustDevice(id, state.mineName.trim());
    state.minePin = ''; state.minePinMsg = null;
    state.mineStage = 'view';
    await computeMineSummary();
    paintMineResult();
    return;
  }
  if(res.status === 'locked'){
    state.mineStage = 'locked'; state.mineLockUntil = res.minutes; state.minePin = '';
    paintMineResult(); return;
  }
  if(res.status === 'none'){   // 途中でリセットされた場合
    state.mineStage = 'setPin'; state.minePin = ''; state.minePinMsg = null;
    paintMineResult(); return;
  }
  state.minePin = '';
  state.minePinMsg = t.pinWrong.replace('{n}', res.left);
  paintMineResult();
}

    state.minePinChangeOpen = false; state.minePinMsg = null;
    state.minePinNotice = t2.pinChanged;
    paintMineResult();
  };

  box.querySelectorAll('[data-stop-rec]').forEach(b=>{
    b.onclick = async ()=>{
      b.disabled = true;
      // 削除ではなく終了日を入れる。過ぎた月の金額を後から変えないため。
      const stopEnd = isPastCutoff(todayISO()) ? todayISO() : yesterdayISO();
      rec.recurring = (rec.recurring||[]).map(r=>{
        if(r.id !== b.dataset.stopRec) return r;

        return Object.assign({}, r, {end, stoppedAt:new Date().toISOString()});
      });
      await setEmp(rec.employeeId, rec);
      await computeMineSummary();
      paintMineResult();
    };
  });
}

function mealTypeJa(v){ return v==='set' ? 'セット' : (v==='okazu' ? 'おかず' : (v==='none' ? '利用なし' : '未設定')); }
function masterToText(list){
  return list
    .slice()
    .sort((a,b)=> String(a.id).localeCompare(String(b.id),'ja',{numeric:true}))
    .map(e=>{
      const cols = [e.id, e.name, e.mealType==='set'?'セット':e.mealType==='okazu'?'おかず':e.mealType==='none'?'利用なし':''];
      if(e.pauseStart || e.pauseEnd) cols.push(e.pauseStart||'', e.pauseEnd||'');
      return cols.join(',');
    }).join('\n');
}
function masterEntryDesc(e){
  const p = e.pauseStart ? `／停止 ${e.pauseStart}〜${e.pauseEnd||'未定'}` : '';
  return `${e.id} ${e.name}（${mealTypeJa(e.mealType)}${p}）`;
}
function diffMaster(oldList, newList){
  const oldMap = new Map(oldList.map(e=>[String(e.id), e]));
  const newMap = new Map(newList.map(e=>[String(e.id), e]));
  const added = [], removed = [], changed = [];
  newMap.forEach((n, id)=>{
    const o = oldMap.get(id);
    if(!o){ added.push(n); return; }
    const parts = [];
    if(String(o.name||'') !== String(n.name||'')) parts.push(`氏名 ${o.name} → ${n.name}`);
    if((o.mealType||'') !== (n.mealType||'')) parts.push(`お食事タイプ ${mealTypeJa(o.mealType)} → ${mealTypeJa(n.mealType)}`);
    const oP = o.pauseStart ? `${o.pauseStart}〜${o.pauseEnd||'未定'}` : 'なし';
    const nP = n.pauseStart ? `${n.pauseStart}〜${n.pauseEnd||'未定'}` : 'なし';
    if(oP !== nP) parts.push(`停止期間 ${oP} → ${nP}`);
    if(parts.length) changed.push({id, name:n.name, parts});
  });
  oldMap.forEach((o, id)=>{ if(!newMap.has(id)) removed.push(o); });
  return {added, removed, changed};
}

/* 貼り付けられた日付を読み取って、登録できるものに振り分ける */
function parseClosedBulk(text, already){
  const tokens = String(text||'').split(/[\s,、\t]+/).filter(Boolean);
  const dup=new Set(), weekend=[], bad=[], add=new Set();
  const have = new Set(already||[]);
  tokens.forEach(tk=>{
    const d = normDate(tk);
    if(d === null || d === ''){ bad.push(tk); return; }
    const wd = parseISO(d).getDay();
    if(wd===0 || wd===6){ weekend.push(d); return; }
    if(have.has(d)){ dup.add(d); return; }
    add.add(d);
  });
  return {
    add: Array.from(add).sort(),
    dup: Array.from(dup).sort(),
    weekend: Array.from(new Set(weekend)).sort(),
    bad,
  };
}
function renderClosedBulkPreview(pv){
  const t = T.ja;
  const hasPast = pv.add.some(d=>d < todayISO());
  const list = arr => arr.map(d=>`${d}（${dowLabel(d,'ja')}）`).join('、');

      ${pv.dup.length ? `<div class="diffsec"><div class="t">${t.closedBulkDup.replace('{n}', pv.dup.length)}</div>
        <p class="small" style="margin:0;">${escapeHtml(list(pv.dup))}</p></div>` : ''}
      ${pv.weekend.length ? `<div class="diffsec"><div class="t">${t.closedBulkWeekend.replace('{n}', pv.weekend.length)}</div>

  return `

    <div class="subsec">

      <p class="footnote" style="margin-top:0;">${t.rosterImportHelp}</p>

    ${state.masterBulkOpen ? `

/* 社員番号を変えたとき、キャンセル記録・購入記録・PINも新しい番号へ移す */
async function migrateEmployeeId(oldId, newId){
  const emp = await getEmp(oldId);
  if(emp){
    emp.employeeId = newId;
    await setEmp(newId, emp);
    await kvRequest('kvDelete', {key:'emp:'+oldId});
  }
  const pin = await getPinRecord(oldId);
  if(pin){
    await setPinRecord(newId, pin);
    await deletePinRecord(oldId);
  }
}

/* 目立たせたくないカードは折りたたんで表示する */
function qcard(key, title, body){
  const open = !!(state.adminOpen && state.adminOpen[key]);
  return `<div class="card cardq">
      <div class="cardq-head" data-toggle="${key}">
        <h2>${title}</h2><span class="chev">${open ? '▾' : '▸'}</span>
      </div>
      ${open ? `<div style="margin-top:14px;">${body}</div>` : ''}
    </div>`;
}

/* ---------- ADMIN DASHBOARD ---------- */
async function renderAdmin(vp){
  const t = T.ja;
  vp.innerHTML = `<div class="card"><p class="small">読み込み中…</p></div>`;

  let records = [];
  let cache = null;

  // スプレッドシートへの問い合わせはここだけ。
  // 折りたたみの開閉や検索は、この読み込み済みデータから描き直すので通信しない。
  //
  // 従業員マスタ・全社員の記録・休業日・セット料金指定日は、Apps Script側の
  // adminBootstrap で「スプレッドシートを1回だけ開いて」まとめて取得する。
  // （以前は4つを別々に問い合わせており、呼び出し回数分の起動オーバーヘッドが
  //  乗って遅くなっていたため。バックエンド側の対応が必要。）
  //
  // 「閲覧用PINの管理」欄だけは、社員が増えるほど全件スキャンが重くなるため、
  // ログイン直後には読み込まず、実際にそのカードを開いたときだけ読み込む。
  async function loadAll(){
    const boot = await kvRequest('adminBootstrap', {}) || {};
    const recs = [];
    (boot.emp || []).forEach(item=>{ try{ recs.push(JSON.parse(item.value)); }catch(e){} });
    const master = [];
    (boot.master || []).forEach(item=>{ try{ master.push(JSON.parse(item.value)); }catch(e){} });
    let specialDays = [];
    try{ specialDays = boot.specialPriceDays ? JSON.parse(boot.specialPriceDays) : []; }catch(e){ specialDays = []; }
    let closedDays = [];
    try{ closedDays = boot.closedDays ? JSON.parse(boot.closedDays) : []; }catch(e){ closedDays = []; }

    records = recs;
    state.adminAllRecords = recs;
    specialDays.sort(); closedDays.sort();
    state.closedDays = closedDays;
    // 他の画面（社員側カレンダーなど）が使うキャッシュにも反映しておき、二重取得を防ぐ
    settingsCache.specialPriceDays = specialDays;
    settingsCache.closedDays = closedDays;
    const prevPinMap = cache ? cache.pinMap : null;  // 開いたことがあれば引き継ぐ
    cache = {master:master, specialDays:specialDays, closedDays:closedDays, pinMap:prevPinMap};
    if(!state.employeeMasterText) state.employeeMasterText = masterToText(master);
  }
  // PIN一覧はここでだけ読み込む（カードを開いたとき・書き込み後の再読み込み時のみ）
  async function loadPinMap(){
    cache.pinMap = await listPinRecords();
  }
  // 書き込みのあとは最新の状態を読み直す（PINは、すでに開いていた場合だけ一緒に更新）
  async function reload(){
    const pinWasLoaded = !!(cache && cache.pinMap);
    await loadAll();
    if(pinWasLoaded) await loadPinMap();
    drawAdmin();
  }

  // 何秒か経ったらメッセージを消す。項目ごとにタイマーを分けて、
  // 別の操作のタイマーに消されないようにする。
  const msgTimers = {};
  function autoClear(key, ms){
    if(msgTimers[key]) clearTimeout(msgTimers[key]);
    msgTimers[key] = setTimeout(()=>{ state[key] = null; drawAdmin(); }, ms || 5000);
  }

  await loadAll();
  drawAdmin();


  function occurrencesForDate(dateStr){
    const dt = parseISO(dateStr);
    const wd = dt.getDay();
    const out = [];
    records.forEach(rec=>{
      if((rec.singleDates||[]).includes(dateStr)){
        out.push({employeeId:rec.employeeId,name:rec.name,type:'single'});
      }
      (rec.recurring||[]).forEach(rule=>{
        if(!rule.weekdays.includes(wd)) return;
        if(rule.start && dateStr < rule.start) return;
        if(rule.end && dateStr > rule.end) return;
        out.push({employeeId:rec.employeeId,name:rec.name,type:'recurring'});
      });
    });
    // 同じ人が個別＋定期で重複しないようにまとめる
    const seen = new Set();
    return out.filter(x=>{
      if(seen.has(x.employeeId)) return false;
      seen.add(x.employeeId); return true;
    });
  }

  function drawAdmin(){
    const master = cache.master, specialDays = cache.specialDays,
          closedDays = cache.closedDays;
    const pinMapLoaded = !!cache.pinMap;
    const pinMap = cache.pinMap || {};   // 未読込のあいだは空扱い（PINカードは「読み込み中」表示にするため実害なし）
    const closedSet = new Set(closedDays);
    const masterById = new Map(master.map(e=>[String(e.id), e]));

    const tISO = todayISO();
    const bISO = state.boardDate || tISO;          // 上部の表示対象日（前後に移動できる）
    const todayIsClosed = closedSet.has(bISO);
    const todayCancelList = occurrencesForDate(bISO);
    const cancelledIdsToday = new Set(todayCancelList.map(x=>String(x.employeeId)));

    const masterAvailable = master.length > 0;
    let eatingTotal=0, eatingSet=0, eatingOkazu=0, eatingUnknown=0;
    let cancelTotal=0, cancelSet=0, cancelOkazu=0, cancelUnknown=0;
    let pausedTotal=0;

    if(masterAvailable){
      master.forEach(e=>{
        if(e.mealType === 'none') return; // ランチを利用しない人は人数に含めない
        if(isPausedOn(e, bISO)){ pausedTotal++; return; }
        if(cancelledIdsToday.has(String(e.id))){
          cancelTotal++;
          if(e.mealType==='set') cancelSet++; else if(e.mealType==='okazu') cancelOkazu++; else cancelUnknown++;
        }else{
          eatingTotal++;
          if(e.mealType==='set') eatingSet++; else if(e.mealType==='okazu') eatingOkazu++; else eatingUnknown++;
        }
      });
    } else {
      cancelTotal = todayCancelList.length;
    }

    const searchDate = state.adminDateSearch || tISO;
    const dateList = occurrencesForDate(searchDate);

    const nameSearchLower = (state.adminSearch||'').trim().toLowerCase();
    const nameResults = nameSearchLower ? records.filter(r=>
      (r.employeeId+'').toLowerCase().includes(nameSearchLower) || (r.name||'').toLowerCase().includes(nameSearchLower)
    ).sort((a,b)=> (a.employeeId+'').localeCompare(b.employeeId+'')) : [];

    // 閲覧用PINの状況
    const pinStats = {set:0, unset:0, locked:0};
    const pinRows = master.map(e=>{
      const rec = pinMap[String(e.id)];
      const lockMin = pinLockRemainMinutes(rec);
      const hasPin = !!rec;
      if(!hasPin) pinStats.unset++;
      else if(lockMin > 0) pinStats.locked++;
      else pinStats.set++;
      return {
        id:String(e.id), name:e.name, hasPin,
        stateLabel: !hasPin ? t.adminPinStateOff : (lockMin>0 ? `${t.adminPinStateLock}（あと約${lockMin}分）` : t.adminPinStateOn),
        stateClass: !hasPin ? 'off' : (lockMin>0 ? 'lock' : 'on'),
      };
    });
    const pinQuery = (state.adminPinSearch||'').trim().toLowerCase();
    const pinSearchResults = pinQuery
      ? pinRows.filter(e=> e.id.toLowerCase().includes(pinQuery) || (e.name||'').toLowerCase().includes(pinQuery))

    const pinUnsetList = pinRows.filter(e=>!e.hasPin);

    const pausedList = master.filter(e=>e.pauseStart && (!e.pauseEnd || e.pauseEnd > tISO))
      .sort((a,b)=> String(a.pauseStart).localeCompare(String(b.pauseStart)));

    vp.innerHTML = `
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;">
        <button class="btn btn-ghost" id="admin-refresh">${t.refresh}</button>
        <button class="btn btn-ghost" id="admin-logout">${t.logout}</button>
      </div>

      <div class="board">
        <div class="boardnav">
          <button type="button" class="navbtn" data-board-shift="-1">‹</button>
          <button type="button" class="navbtn" data-board-shift="1">›</button>
          <span class="d">${bISO}（${dowLabel(bISO,'ja')}）${t.adminTodayLabel}</span>
          ${bISO===tISO ? `<span class="todaypill">${t.boardToday}</span>`
                        : `<button type="button" class="backtoday" id="board-today">${t.boardBackToday}</button>`}
        </div>
        ${todayIsClosed ? `
        <div class="board-main">
          <div class="board-main-lbl" style="font-size:20px;font-family:'Shippori Mincho',serif;">${t.boardClosedToday}</div>
        </div>
        ` : masterAvailable ? `
        <div class="board-main">
          <div class="board-main-num">${eatingTotal}</div>
          <div class="board-main-lbl">${t.eatingToday}</div>
          <div class="board-main-sub">${t.setLabel} ${eatingSet}${t.peopleUnit} ・ ${t.okazuLabel} ${eatingOkazu}${t.peopleUnit}${eatingUnknown? ' ・ '+t.unknownLabel+' '+eatingUnknown+t.peopleUnit : ''}</div>
        </div>
        <div class="board-sub">
          <div class="board-sub-num">${cancelTotal}</div>
          <div class="board-sub-lbl">${t.cancelToday}</div>
          <div class="board-sub-sub">${t.setLabel} ${cancelSet}${t.peopleUnit} ・ ${t.okazuLabel} ${cancelOkazu}${t.peopleUnit}${cancelUnknown? ' ・ '+t.unknownLabel+' '+cancelUnknown+t.peopleUnit : ''}</div>
          ${pausedTotal? `<div class="board-sub-sub">${t.pausedLabel} ${pausedTotal}${t.peopleUnit}（停止期間中のため人数に含みません）</div>`:''}
        </div>
        ` : `
        <div class="board-main">
          <div class="board-main-num">${cancelTotal}</div>
          <div class="board-main-lbl">${t.cancelToday}</div>
        </div>
        <p class="board-sub-sub" style="text-align:center;">${t.masterNeededForBoard}</p>
        `}
      </div>

      ${qcard('search', t.searchTitle, `
        <div class="modeswitch" style="margin-bottom:14px;">
          <button type="button" class="${state.adminSearchMode==='date'?'active':''}" data-search-mode="date">${t.searchByDate}</button>
          <button type="button" class="${state.adminSearchMode==='emp'?'active':''}" data-search-mode="emp">${t.searchByEmp}</button>
        </div>
        ${state.adminSearchMode==='emp' ? `
        <input type="text" id="adm-name-search" placeholder="${t.nameSearchPh}" value="${escapeHtml(state.adminSearch||'')}">
        <div id="adm-name-results" style="margin-top:10px;">
          ${nameSearchLower ? (nameResults.length? nameResults.map(r=>{
            const singles = (r.singleDates||[]).sort().join('、') || t.none;
            const recs = (r.recurring||[]).map(rule=>{
              const wdNames = rule.weekdays.map(i=>['日','月','火','水','木','金','土'][i]).join('・');
              return `毎週${wdNames}（${rule.start}〜${rule.end||'継続'}）`;

            const me = masterById.get(String(r.employeeId));
            return `<div class="daylist item" style="display:block;">

              <p class="small" style="margin:6px 0 2px">個別: ${escapeHtml(singles)}</p>
              <p class="small" style="margin:2px 0">定期: ${escapeHtml(recs)}</p>

      ${qcard('special', t.specialDaysTitle, `

        <div class="daylist" style="margin-top:10px;">
          ${specialDays.length? specialDays.map(d=>`<div class="item"><span>${d}（${dowLabel(d,'ja')}）</span><button class="btn btn-ghost" style="padding:3px 10px;font-size:12px" data-remove-special="${d}">${t.specialDaysRemove}</button></div>`).join('') : `<p class="small">${t.specialDaysNone}</p>`}

      ${qcard('closed', t.closedDaysTitle, `

        <div class="daylist" style="margin-top:10px;">

      ${qcard('csv', t.csvExportTitle, `

/* 「社員番号,氏名,お食事タイプ,停止開始日,再開日」を読み取る */
function parseMasterText(text){
  const t = T.ja;
  const lines = String(text||'').split('\n');
  const list = [];
  const seenIds = new Set();
  for(let i=0;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const lineNo = i+1;
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length < 2 || !parts[0] || !parts[1]){
      return {error: t.employeeMasterInvalid.replace('{line}', lineNo)};
    }
    const id = parts[0], name = parts[1], typeRaw = parts[2]||'';
    let mealType;
    if(typeRaw){
      if(/セット|^set$/i.test(typeRaw)) mealType = 'set';
      else if(/おかず|^okazu$/i.test(typeRaw)) mealType = 'okazu';
      else if(/利用なし|^none$/i.test(typeRaw)) mealType = 'none';
    }
    const pauseStart = normDate(parts[3]||'');
    const pauseEnd = normDate(parts[4]||'');
    if(pauseStart===null || pauseEnd===null){
      return {error: t.employeeMasterBadDate.replace('{line}', lineNo)};
    }
    if(pauseStart && pauseEnd && pauseEnd < pauseStart){
      return {error: t.employeeMasterBadRange.replace('{line}', lineNo)};
    }
    if(seenIds.has(id)){
      return {error: t.employeeMasterDup.replace('{line}', lineNo).replace('{id}', id)};
    }
    seenIds.add(id);
    const entry = {id, name, mealType};
    if(pauseStart) entry.pauseStart = pauseStart;
    if(pauseEnd) entry.pauseEnd = pauseEnd;
    list.push(entry);
  }
  return {list};
}

function renderMasterDiff(pending){
  const t = T.ja;
  const d = pending.diff;
  const nothing = !d.added.length && !d.removed.length && !d.changed.length;
  return `
    <div class="diffbox">
      <h3>${t.diffTitle}</h3>
      ${nothing ? `<p class="small">${t.diffSame}</p>` : ''}
      ${d.added.length ? `<div class="diffsec"><div class="t">${t.diffAdd.replace('{n}', d.added.length)}</div>
        <ul>${d.added.map(e=>`<li>${escapeHtml(masterEntryDesc(e))}</li>`).join('')}</ul></div>` : ''}
      ${d.changed.length ? `<div class="diffsec"><div class="t">${t.diffChange.replace('{n}', d.changed.length)}</div>
        <ul>${d.changed.map(c=>`<li>${escapeHtml(c.id+' '+c.name)}：${escapeHtml(c.parts.join('、'))}</li>`).join('')}</ul></div>` : ''}
      ${d.removed.length ? `<div class="diffsec del"><div class="t">${t.diffDel.replace('{n}', d.removed.length)}</div>
        <ul>${d.removed.map(e=>`<li>${escapeHtml(masterEntryDesc(e))}</li>`).join('')}</ul>
        <p class="footnote" style="color:var(--danger)">${t.diffDelWarn}</p></div>` : ''}
      <p class="small">保存後の人数：${pending.list.length}件</p>
      <div class="btnrow">
        <button class="btn btn-accent" id="adm-master-confirm">${t.employeeMasterConfirm}</button>
        <button class="btn btn-ghost" id="adm-master-cancel">${t.employeeMasterCancel}</button>
      </div>
    </div>
  `;
}

/* ---- Monthly payroll-deduction CSV export ---- */
async function exportMonthlyCsv(records, master, specialList, closedList, yyyyMm){
  const [yStr, mStr] = yyyyMm.split('-');
  const y = parseInt(yStr,10);
  const m0 = parseInt(mStr,10) - 1; // 0-indexed month of the DATA (e.g. June => 5)
  const dataMonthNum = m0 + 1; // 1-12, e.g. June => 6

  // 給与処理回 = data month + 1 (wraps 12 -> 1, and the year rolls over with it)
  let payRound = dataMonthNum + 1;
  let payYear = y;
  if(payRound > 12){ payRound = 1; payYear = y + 1; }

  const specialSet = new Set(specialList);
  const closedSet = new Set(closedList);
  const servingDays = servingDaysInMonth(y, m0, closedSet); // 平日 − 休業日
  let missingMealType = 0;

  // cancelled-day set per employee id, built from records (only source of cancellation data)
  const cancelledByEmp = {};
  const purchaseByEmp = {}; // 割引商品の購入額（その月分）
  records.forEach(rec=>{
    const sets = cancelledSetsForMonth(rec, y, m0);
    cancelledByEmp[rec.employeeId] = {name:rec.name, cancelled:sets.all};
    purchaseByEmp[rec.employeeId] = purchaseTotal(purchasesInMonth(rec, y, m0));
  });

  // base employee list: prefer the uploaded roster (includes people who never cancel);
  // fall back to whoever has cancellation records if no roster has been configured.
  const baseList = master.length
    ? master.map(e=>({id:e.id, name:e.name, mealType:e.mealType, pauseStart:e.pauseStart, pauseEnd:e.pauseEnd}))
    : Object.keys(cancelledByEmp).map(id=>({id, name:cancelledByEmp[id].name, mealType:undefined}));

  const perEmployee = {}; // id -> {name, amount}
  baseList.forEach(e=>{
    const mealTypeKnown = e.mealType==='set' || e.mealType==='okazu' || e.mealType==='none';
    if(!mealTypeKnown) missingMealType++;
    const cancelled = (cancelledByEmp[e.id] && cancelledByEmp[e.id].cancelled) || new Set();
    const calc = calcForEmployee(e, cancelled, servingDays, specialSet);
    const purchase = Number(purchaseByEmp[e.id]||0);
    perEmployee[e.id] = {name:e.name, amount:calc.amount + purchase, lunch:calc.amount, purchase};
  });

  const ids = Object.keys(perEmployee).sort((a,b)=> a.localeCompare(b,'ja',{numeric:true}));

  const EMPTY_TAIL = ',,,,,,,,,,,'; // matches the 11 trailing empty columns in the reference file
  const header = ['社員No','給与処理年','給与処理回','支給グループ','弁当・食品購入代'].join(',') + EMPTY_TAIL;
  const rows = ids.map(id=>{
    const e = perEmployee[id];
    return [id, payYear, payRound, 1, e.amount].join(',') + EMPTY_TAIL;
  });
  const csvBody = [header, ...rows].join('\r\n') + '\r\n';

  const filename = `食品控除データ_${dataMonthNum}月.csv`;

  let blob;
  if(window.Encoding){
    const unicodeArray = Encoding.stringToCode(csvBody);
    const sjisArray = Encoding.convert(unicodeArray, {to:'SJIS', from:'UNICODE'});
    blob = new Blob([new Uint8Array(sjisArray)], {type:'text/csv'});
  } else {
    // fallback: UTF-8 with BOM if the Shift-JIS library failed to load
    blob = new Blob(['\uFEFF'+csvBody], {type:'text/csv'});
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  return { count: ids.length, missingMealType };
}

/* ===================== utils ===================== */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== 起動 ===================== */
(async function bootstrap(){
  await loadEmpProfile();
  render();
  try{
    const closed = await getClosedDays();
    if(closed && closed.length){
      state.closedDays = closed;
      if(state.view==='main') render(); // カレンダーの休業日を反映
    }
  }catch(e){ /* 休業日が取れなくてもフォームは使える */ }
  ensureEmployeeMasterSeeded(); // バックグラウンドで実行（表示をブロックしない）
})();
</script>
